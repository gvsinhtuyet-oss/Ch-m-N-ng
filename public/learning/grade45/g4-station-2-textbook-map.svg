<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Khu đền tháp Mỹ Sơn – Bảo tàng Điêu khắc Chăm Đà Nẵng</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#92400e"/><g font-family="Arial,sans-serif" fill="#92400e"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Khu đền tháp Mỹ Sơn – Bảo tàng Điêu</text><text x="64" y="170" font-size="32" font-weight="bold">khắc Chăm Đà Nẵng</text><text x="64" y="255" font-size="24" fill="#334155">1. Mỹ Sơn trong thung lũng</text><text x="64" y="297" font-size="24" fill="#334155">2. Dấu ấn nhiều thế kỉ</text><text x="64" y="339" font-size="24" fill="#334155">3. Kiến trúc và điêu khắc Chăm-pa</text><text x="64" y="381" font-size="24" fill="#334155">4. Bảo tàng Điêu khắc Chăm Đà Nẵng</text><text x="64" y="423" font-size="24" fill="#334155">5. Từ công trình đến hiện vật</text><text x="64" y="465" font-size="24" fill="#334155">6. Tham quan và gìn giữ di sản</text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>