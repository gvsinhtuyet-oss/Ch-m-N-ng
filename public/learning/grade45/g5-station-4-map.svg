<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Đọc dấu xưa trên miền non nước</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#047857"/><text x="70" y="86" font-size="28" fill="white">Đọc dấu xưa trên miền non nước</text><circle cx="90" cy="210" r="25" fill="#047857"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Cảnh núi và hang động</text><text x="140" y="244" font-size="16" fill="#334155">Ngũ Hành Sơn có giá trị cảnh quan và văn hóa.</text><circle cx="90" cy="315" r="25" fill="#047857"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Dấu tích và không gian văn hóa</text><text x="140" y="349" font-size="16" fill="#334155">Tìm hiểu di tích bằng tư liệu, đồng thời tôn trọng không gian văn hóa.</text><circle cx="90" cy="420" r="25" fill="#047857"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Ma nhai – thông tin trên đá</text><text x="140" y="454" font-size="16" fill="#334155">Phân biệt danh thắng Ngũ Hành Sơn với di sản tư liệu ma nhai và phạm vi ghi</text><text x="140" y="479" font-size="16" fill="#334155">danh khu vực.</text><circle cx="90" cy="525" r="25" fill="#047857"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Giữ đá, giữ nghề và câu chuyện</text><text x="140" y="559" font-size="16" fill="#334155">Không làm hại cảnh quan, văn khắc và không tự thực hiện thao tác bảo tồn.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>