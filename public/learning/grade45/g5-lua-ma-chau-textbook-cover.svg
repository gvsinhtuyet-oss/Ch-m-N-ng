<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 735"><title>Từ lá dâu đến tấm lụa</title><rect width="960" height="735" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="695" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Từ lá dâu đến tấm lụa</text><text x="65" y="195" font-size="20" fill="#047857">KHỐI 5 · HÀNH TRÌNH KHÁM PHÁ</text><text x="65" y="255" font-size="25" fill="#334155">1. Làng lụa ở Nam Phước</text><text x="65" y="350" font-size="25" fill="#334155">2. Trồng dâu và nuôi tằm</text><text x="65" y="445" font-size="25" fill="#334155">3. Bủa kén và ươm tơ</text><text x="65" y="540" font-size="25" fill="#334155">4. Dệt và hoàn thiện tấm lụa</text><text x="65" y="635" font-size="25" fill="#334155">5. Sản phẩm và cách giữ nghề</text><text x="55" y="695" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>