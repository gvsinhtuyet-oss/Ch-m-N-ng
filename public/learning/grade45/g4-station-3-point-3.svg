<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Dịch vụ kết nối cuộc sống</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#0369a1"/><text x="70" y="86" font-size="28" fill="white">Dịch vụ kết nối cuộc sống</text><circle cx="480" cy="260" r="65" fill="#e0f2fe"/><path d="M450 260l22 22 43-45" fill="none" stroke="#0369a1" stroke-width="12" stroke-linecap="round"/><text x="85" y="395" font-size="29" fill="#334155">Dịch vụ hỗ trợ nhu cầu và kết nối các hoạt động kinh tế.</text><text x="85" y="590" font-size="20" fill="#334155">Quan sát tư liệu · Tìm căn cứ · Chia sẻ điều em hiểu</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>