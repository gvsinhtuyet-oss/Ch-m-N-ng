<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Giữa núi rừng và cửa ải</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#047857"/><text x="70" y="86" font-size="28" fill="white">Giữa núi rừng và cửa ải</text><circle cx="90" cy="210" r="25" fill="#047857"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Bà Nà – cảnh núi rừng</text><text x="140" y="244" font-size="16" fill="#334155">Bà Nà có giá trị cảnh quan núi rừng; công trình du lịch là phần do con</text><text x="140" y="269" font-size="16" fill="#334155">người tạo dựng.</text><circle cx="90" cy="315" r="25" fill="#047857"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Hải Vân Quan trên đỉnh đèo</text><text x="140" y="349" font-size="16" fill="#334155">Hải Vân Quan là công trình lịch sử trên đèo Hải Vân.</text><circle cx="90" cy="420" r="25" fill="#047857"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Hai nơi, nhiều giá trị</text><text x="140" y="454" font-size="16" fill="#334155">So sánh điểm đến bằng thông tin đúng từng đối tượng.</text><circle cx="90" cy="525" r="25" fill="#047857"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Tham quan để hiểu và gìn giữ</text><text x="140" y="559" font-size="16" fill="#334155">Tham quan có trách nhiệm là vừa tìm hiểu vừa giữ cảnh quan và di tích.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>