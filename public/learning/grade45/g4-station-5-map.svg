<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Theo sợi tơ về làng lụa</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#0369a1"/><text x="70" y="86" font-size="28" fill="white">Theo sợi tơ về làng lụa</text><circle cx="90" cy="210" r="25" fill="#0369a1"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Mã Châu và những tấm lụa</text><text x="140" y="244" font-size="16" fill="#334155">Tấm lụa từ sợi tơ.</text><circle cx="90" cy="315" r="25" fill="#0369a1"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Từ kén đến sợi tơ</text><text x="140" y="349" font-size="16" fill="#334155">Kén, sợi tơ và tấm lụa thuộc các bước khác nhau của hành trình làm lụa.</text><circle cx="90" cy="420" r="25" fill="#0369a1"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Khung dệt và hoa văn</text><text x="140" y="454" font-size="16" fill="#334155">Nghề dệt kết hợp kĩ năng truyền thống với sự sáng tạo.</text><circle cx="90" cy="525" r="25" fill="#0369a1"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Quý sản phẩm, giữ câu chuyện nghề</text><text x="140" y="559" font-size="16" fill="#334155">Trân trọng công sức lao động và hạn chế lãng phí.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>