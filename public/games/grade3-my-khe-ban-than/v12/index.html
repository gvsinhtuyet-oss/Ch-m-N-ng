*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#18324b;background:#d7f1fa}button{font:inherit;cursor:pointer;touch-action:manipulation}.scene{min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(180deg,#80d9ff 0%,#b8f1fa 34%,#17b9d0 35%,#0e93b8 59%,#e8d29b 60%,#f7e3af 100%)}.scene:before{content:'☀️';position:absolute;right:12%;top:10%;font-size:65px;opacity:.7}.scene:after{content:'🌴';position:absolute;bottom:10%;left:0;font-size:clamp(80px,15vw,190px);pointer-events:none}.shell{position:relative;z-index:1;max-width:900px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:14px 16px 24px}.head{text-align:center;margin-bottom:14px}.head h1{display:inline-block;margin:0;padding:9px 18px;border:3px solid #8a521c;border-radius:18px;background:linear-gradient(#ffe49c,#c9843b);box-shadow:0 5px #86511c;color:#57310c;font-size:clamp(18px,3vw,27px);text-shadow:0 1px #fff}.head small{display:block;margin-top:9px;font-weight:900;color:#064b69;text-shadow:0 1px #fff}.panel{margin:auto 0;background:#fffaf0f2;border:4px solid #dbad59;border-radius:24px;box-shadow:0 14px 32px #17476555;padding:clamp(16px,3vw,28px)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:900;color:#78531c}.gems{letter-spacing:4px;font-size:21px}.prompt{font-size:clamp(21px,3.6vw,30px);line-height:1.3;margin:14px 0 22px;text-align:center;color:#184365}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.answers button,.match button{min-height:88px;padding:14px;border-radius:17px;background:#fff;border:3px solid #8dc8db;color:#173f57;font-weight:850;box-shadow:0 4px #7db6c9}.answers button:hover,.match button:hover{border-color:#ffb93d}.answers button:disabled{cursor:default}.answers button.good{background:#c8ffd8;border-color:#1aa85a}.answers button.bad{background:#ffe0dc;border-color:#e74a43}.answers.two{grid-template-columns:repeat(2,minmax(0,1fr))}.answers.two button{font-size:22px}.match{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,3vw,32px);position:relative}.matchcol{display:grid;gap:12px}.match button{min-height:77px;position:relative;z-index:2;font-size:clamp(13px,2.4vw,17px);padding:8px}.match button.selected{outline:4px solid #f6a72c}.match button.linked{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}.feedback{min-height:54px;margin-top:16px;font-weight:800;text-align:center;color:#a3452a}.feedback.ok{color:#138347}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px}.btn{background:linear-gradient(#ffe08c,#f2a43c);color:#6a390c;border:2px solid #a96923;border-radius:16px;padding:12px 22px;font-weight:900;min-height:49px}.btn:disabled{opacity:.5}.secondary{background:#e3f6ff;border-color:#6ab4d7;color:#185575}.victory{text-align:center}.victory .chest{font-size:clamp(90px,17vw,150px);animation:bounce 1.2s infinite alternate}.victory h2{font-size:clamp(24px,5vw,40px);color:#b16a12}.fireworks{font-size:40px;animation:bounce .6s infinite alternate}@keyframes bounce{to{transform:translateY(-10px) scale(1.06)}}@media(max-width:580px){.shell{padding:10px}.panel{padding:14px;border-width:3px}.answers{grid-template-columns:1fr}.answers button{min-height:60px}.answers.two{grid-template-columns:1fr 1fr}.match{gap:8px}.match button{min-height:86px}.gems{font-size:16px;letter-spacing:1px}.top{font-size:11px}.head h1{font-size:18px}.scene:after{opacity:.35}.controls{flex-wrap:wrap}}

function startFireworks(){
 const canvas=document.querySelector('#firecanvas');if(!canvas)return;
 const ctx=canvas.getContext('2d');let particles=[],last=0,raf=0;
 const palette=['#ffe86a','#ff66cf','#70e9ff','#93ff9a','#ffffff','#ffac5e','#b6a4ff'];
 function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d)}
 function burst(){
  const x=canvas.width*(.12+Math.random()*.76),y=canvas.height*(.08+Math.random()*.48);
  const color=palette[Math.floor(Math.random()*palette.length)];
  for(let i=0;i<76;i++){const a=i*Math.PI*2/76+Math.random()*.08,v=(1.3+Math.random()*3.6)*Math.max(1,canvas.width/1100);
   particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color,r:1.2+Math.random()*2.2});
  }
  if(particles.length>850)particles=particles.slice(-850);
 }
 resize();burst();burst();
 function draw(time){
  if(!canvas.isConnected){cancelAnimationFrame(raf);return}
  if(canvas.width!==Math.round(canvas.clientWidth*Math.min(devicePixelRatio||1,2)))resize();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(time-last>460){last=time;burst()}
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
   p.x+=p.vx;p.y+=p.vy;p.vx*=.991;p.vy=p.vy*.991+.017;p.life-=.012;
   ctx.globalAlpha=Math.max(0,p.life);
   ctx.shadowBlur=17;ctx.shadowColor=p.color;ctx.fillStyle=p.color;
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
  particles=particles.filter(p=>p.life>0);
  raf=requestAnimationFrame(draw);
 }

 fireTimer={stop:()=>cancelAnimationFrame(raf)};
}

// Sử dụng Web Audio trực tiếp trong pointerdown để mở khóa âm thanh trên mobile.
let tapAudioCtx;
function playTapSound(){
 try {
  tapAudioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
  if(tapAudioCtx.state==='suspended') tapAudioCtx.resume();
  const t=tapAudioCtx.currentTime;
  const osc=tapAudioCtx.createOscillator(), gain=tapAudioCtx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(680,t);
  osc.frequency.exponentialRampToValueAtTime(1040,t+.095);
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.24,t+.018);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.20);
  osc.connect(gain);gain.connect(tapAudioCtx.destination);
  osc.start(t);osc.stop(t+.21);
 }catch(e){console.warn('Không thể phát âm nút bấm',e)}
}
let lastPointerTap=0;
