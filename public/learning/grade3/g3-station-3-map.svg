<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Khác nhau để cùng làm nên quê hương</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#be185d"/><text x="75" y="92" font-size="28" fill="white">Khác nhau để cùng làm nên quê hương</text><circle cx="90" cy="200" r="24" fill="#be185d"/><text x="82" y="209" font-size="24" fill="white">1</text><text x="135" y="200" font-size="24" fill="#334155">Nhiều cộng đồng, một quê hương</text><text x="135" y="232" font-size="17" fill="#334155">Có nhiều cộng đồng dân tộc cùng góp sức xây dựng quê hương.</text><circle cx="90" cy="305" r="24" fill="#be185d"/><text x="82" y="314" font-size="24" fill="white">2</text><text x="135" y="305" font-size="24" fill="#334155">Tìm hiểu nét văn hóa</text><text x="135" y="337" font-size="17" fill="#334155">Đọc chú thích để gọi đúng tên hiện vật và cộng đồng.</text><circle cx="90" cy="410" r="24" fill="#be185d"/><text x="82" y="419" font-size="24" fill="white">3</text><text x="135" y="410" font-size="24" fill="#334155">Văn hóa trong đời sống hôm nay</text><text x="135" y="442" font-size="17" fill="#334155">Văn hóa được gìn giữ và tiếp nối trong đời sống; mỗi gia đình có thể khác</text><text x="135" y="469" font-size="17" fill="#334155">nhau.</text><circle cx="90" cy="515" r="24" fill="#be185d"/><text x="82" y="524" font-size="24" fill="white">4</text><text x="135" y="515" font-size="24" fill="#334155">Tôn trọng và cùng tham gia</text><text x="135" y="547" font-size="17" fill="#334155">Lắng nghe, xin phép và không trêu chọc giúp mọi người gần nhau hơn.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>