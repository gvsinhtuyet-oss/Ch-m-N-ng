<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Nam Ô – nghề làm nước mắm</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#b45309"/><text x="75" y="92" font-size="28" fill="white">Nam Ô – nghề làm nước mắm</text><path d="M180 380q90-85 180 0q-90 85-180 0m0 0l-45-45v90z" fill="#38bdf8"/><path d="M420 360h110l35 170H385z" fill="#cbd5e1"/><path d="M650 300h60v70h35v210H615V370h35z" fill="#d97706"/><rect x="630" y="430" width="100" height="70" rx="8" fill="#fef3c7"/><text x="75" y="625" font-size="20" fill="#334155">Nước mắm Nam Ô là sản phẩm gắn với nghề truyền thống địa phương.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>