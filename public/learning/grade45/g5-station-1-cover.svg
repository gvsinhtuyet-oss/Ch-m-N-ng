<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Dòng sông nối những câu chuyện quê hương</title><rect width="960" height="720" rx="30" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="24" y="24" width="912" height="672" rx="26" fill="white"/><rect x="40" y="40" width="880" height="108" rx="20" fill="#047857"/><text x="66" y="88" font-size="27" fill="white">Dòng sông nối những câu chuyện quê hương</text><text x="66" y="190" font-size="20" fill="#047857">KHỐI 5 · HỌC LIỆU THEO CHỦ ĐỀ</text><circle cx="86" cy="239" r="22" fill="#dcfce7"/><text x="79" y="246" font-size="22" fill="#047857">1</text><text x="130" y="247" font-size="25" fill="#334155">Theo dòng Thu Bồn</text><circle cx="86" cy="324" r="22" fill="#dcfce7"/><text x="79" y="331" font-size="22" fill="#047857">2</text><text x="130" y="332" font-size="25" fill="#334155">Hòn Kẽm Đá Dừng bên sông</text><circle cx="86" cy="409" r="22" fill="#dcfce7"/><text x="79" y="416" font-size="22" fill="#047857">3</text><text x="130" y="417" font-size="25" fill="#334155">Dòng sông trong đời sống</text><circle cx="86" cy="494" r="22" fill="#dcfce7"/><text x="79" y="501" font-size="22" fill="#047857">4</text><text x="130" y="502" font-size="25" fill="#334155">Giữ nước, giữ cảnh quan</text><text x="66" y="610" font-size="21" fill="#334155">Quan sát · Tìm hiểu · Vận dụng · Gìn giữ quê hương</text><text x="55" y="674" font-size="17" fill="#475569">Sơ đồ học tập · Không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>