<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650"><title>Địa đạo Kỳ Anh ở đâu?</title><rect width="960" height="650" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="610" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Địa đạo Kỳ Anh ở đâu?</text><text x="75" y="235" font-size="48" fill="#047857">1</text><text x="75" y="325" font-size="28" fill="#334155">Địa đạo Kỳ Anh được đào từ năm 1965 đến cuối năm</text><text x="75" y="363" font-size="28" fill="#334155">1967, nay thuộc phường Bàn Thạch.</text><text x="75" y="535" font-size="24" fill="#334155">Quan sát → Tìm căn cứ → Chia sẻ</text><text x="55" y="610" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>