function showFeedback(message){game.querySelectorAll('.feedback').forEach(x=>x.remove());const e=node('div',{class:'feedback',role:'status',text:message});game.append(e);setTimeout(()=>{if(e.isConnected)e.remove()},3600)}
function goHome(){epoch++;stopFireworks();step=-1;review=false;sequence=[0,1,2,3];wrong.clear();locked=false;matched={};selected=null;completionSent=false;content.innerHTML='';title.textContent=cfg.title;progress.textContent='🌟 NHÀ THÁM HIỂM NHÍ';game.querySelectorAll('.cover,.victory,.feedback').forEach(n=>n.remove());const cover=node('div',{class:'cover'});cover.style.setProperty('--cover','url("'+media(cfg.cover)+'")');const banner=node('div',{class:'banner'});const h=node('h1',{text:cfg.emoji+' '+cfg.title}),sub=node('p',{text:cfg.subtitle}),start=node('button',{class:'primary start',text:'🧭 BẮT ĐẦU KHÁM PHÁ'});start.onclick=()=>{step=0;render()};banner.append(h,sub);cover.append(banner,start);game.append(cover)}
function render(){epoch++;locked=false;selected=null;matched={};missedPair=false;game.querySelectorAll('.cover,.victory,.feedback').forEach(n=>n.remove());const page=sequence[step];const task=cfg.tasks[page];title.textContent=task.question;progress.textContent=(review?'🔎 Truy lại dấu vết':'⭐ Thử thách')+' '+(step+1)+' / '+sequence.length;content.innerHTML='';if(task.kind==='photo')renderPhoto(task,page);else if(task.kind==='choice')renderChoice(task,page);else renderMatch(task,page)}
function response(ok,choice,task,page){if(locked)return;locked=true;choice.classList.add(ok?'good':'bad');beep(ok);if(ok)wrong.delete(page);else wrong.add(page);if(!ok)showFeedback('💡 '+task.hint);else showFeedback('🌟 Chính xác!');const token=epoch;setTimeout(()=>{if(token!==epoch)return;if(review&&!ok){locked=false;choice.classList.remove('bad');return}advance()},ok?1550:3800)}
function renderPhoto(task,page){let grid=node('div',{class:'photo-grid'});task.images.forEach((src,i)=>{let b=node('button',{class:'photo','aria-label':'Hình '+(i+1)});b.append(node('img',{src:media(src),alt:'Hình lựa chọn '+(i+1),loading:'eager'}),node('b',{text:'Hình '+(i+1)}));b.onclick=()=>response(i===task.correct,b,task,page);grid.append(b)});content.append(grid)}
function renderChoice(task,page){let grid=node('div',{class:'answer-grid'});task.options.forEach((text,i)=>{let b=node('button',{class:'answer'});b.append(node('span',{class:'letter',text:'ABC'[i]}),node('span',{text}));b.onclick=()=>response(i===task.correct,b,task,page);grid.append(b)});content.append(grid)}
function renderMatch(task,page){let area=node('div',{class:'match-area'}),colL=node('div',{class:'match-col'}),colR=node('div',{class:'match-col'}),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','lines');area.append(colL,colR,svg);let left=[],right=[];
 task.images.forEach((src,i)=>{let b=node('button',{class:'match-card','aria-label':'Hình '+(i+1)});b.append(node('img',{src:media(src),alt:'Hình '+(i+1)}));b.onclick=()=>{if(locked)return;selected=i;left.forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen')};left.push(b);colL.append(b)});
 task.labels.forEach((text,j)=>{let b=node('button',{class:'match-card',text});b.onclick=()=>{if(locked||selected===null)return;for(const[k,v]of Object.entries(matched))if(Number(k)!==selected&&v===j)delete matched[k];matched[selected]=j;selected=null;left.forEach(x=>x.classList.remove('chosen'));draw();};right.push(b);colR.append(b)});
 let action=node('div',{class:'actions'}),counter=node('span',{class:'status',text:'Đã nối 0/3 cặp'}),confirm=node('button',{class:'primary',text:'✓ XÁC NHẬN'});confirm.disabled=true;action.append(counter,confirm);content.append(area,action);
 const colors=['#23b860','#238eff','#ffae26'];
 function draw(judge=false){svg.innerHTML='';for(const [k,v]of Object.entries(matched)){const i=Number(k),j=Number(v),a=left[i].getBoundingClientRect(),b=right[j].getBoundingClientRect(),parent=area.getBoundingClientRect();let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',(a.right-parent.left)/parent.width*100);line.setAttribute('y1',(a.top+a.height/2-parent.top)/parent.height*100);line.setAttribute('x2',(b.left-parent.left)/parent.width*100);line.setAttribute('y2',(b.top+b.height/2-parent.top)/parent.height*100);line.setAttribute('stroke',judge&&task.right[i]!==j?'#e43d37':colors[i]);svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.append(line)}counter.textContent='Đã nối '+Object.keys(matched).length+'/3 cặp';confirm.disabled=Object.keys(matched).length!==3||locked}
 confirm.onclick=()=>{if(locked||Object.keys(matched).length!==3)return;locked=true;const ok=task.right.every((j,i)=>matched[i]===j);draw(true);beep(ok);if(ok){wrong.delete(page);showFeedback('🌟 Đúng cả 3 cặp!')}else{wrong.add(page);showFeedback('💡 '+task.hint)}let token=epoch;setTimeout(()=>{if(token!==epoch)return;if(review&&!ok){locked=false;matched={};selected=null;draw();return}advance()},ok?1800:3100)};

}
function advance(){step++;if(step<sequence.length){render();return}if(wrong.size){const missed=[...wrong].sort();content.innerHTML='';const overlay=node('div',{class:'cover'});overlay.style.background='linear-gradient(#174867ce,#17354bed),url("'+media(cfg.cover)+'") center/cover no-repeat';const banner=node('div',{class:'banner'});banner.append(node('h1',{text:'🔎 TRUY LẠI DẤU VẾT'}),node('p',{text:'Em còn '+missed.length+' thử thách cần làm lại.'}));const button=node('button',{class:'primary start',text:'🔍 THỬ LẠI'});button.onclick=()=>{review=true;sequence=missed;step=0;render()};overlay.append(banner,button);game.append(overlay)}else victory()}
function victory(){progress.textContent='🏆 HOÀN THÀNH';const v=node('div',{class:'victory'});v.style.setProperty('--cover','url("'+media(cfg.cover)+'")');v.append(node('div',{class:'trophy',text:'🏆'}),node('h1',{text:'CHÚC MỪNG EM ĐÃ HOÀN THÀNH THỬ THÁCH!'}),node('p',{text:'Em thật tuyệt vời!'}));let buttons=node('div',{class:'buttons'}),replay=node('button',{text:'↻ Chơi lại'}),next=node('button',{text:'➜ Tiếp tục hành trình'});replay.onclick=goHome;next.onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-continue',stationId},location.origin);else goHome()};buttons.append(replay,next);v.append(buttons);const canvas=node('canvas',{id:'fireworks'});v.append(canvas);game.append(v);sendCompleted();song();fireworks(canvas)}
function sendCompleted(){if(completionSent)return;completionSent=true;if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-complete',stationId},location.origin)}
function stopFireworks(){if(fireAnim)cancelAnimationFrame(fireAnim);fireAnim=0;particles=[]}
function fireworks(c){stopFireworks();const context=c.getContext('2d');if(!context)return;let last=0;function frame(t){if(!c.isConnected){stopFireworks();return}const r=c.getBoundingClientRect();if(c.width!==Math.round(r.width)){c.width=Math.round(r.width);c.height=Math.round(r.height)}context.clearRect(0,0,c.width,c.height);if(t-last>520){last=t;let x=c.width*(.12+Math.random()*.75),y=c.height*(.08+Math.random()*.5);let colors=['#ffe16d','#5aeeff','#ff92ce','#aaff90','#fff'];for(let i=0;i<54;i++){let a=6.283*i/54,v=1.2+Math.random()*2.5;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:colors[i%colors.length]})}}particles=particles.filter(p=>p.life>0).slice(-450);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.019;p.life-=.016;context.globalAlpha=Math.max(0,p.life);context.fillStyle=p.col;context.shadowColor=p.col;context.shadowBlur=13;context.beginPath();context.arc(p.x,p.y,2.2,0,Math.PI*2);context.fill()}context.globalAlpha=1;context.shadowBlur=0;fireAnim=requestAnimationFrame(frame)}fireAnim=requestAnimationFrame(frame)}
document.getElementById('home').onclick=goHome;document.getElementById('audio').onclick=()=>{soundOn=!soundOn;document.getElementById('audio').textContent=soundOn?'🔊':'🔇'};
