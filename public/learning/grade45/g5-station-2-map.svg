<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Nhớ người đi trước, quý cuộc sống hòa bình</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#047857"/><text x="70" y="86" font-size="28" fill="white">Nhớ người đi trước, quý cuộc sống hòa bình</text><circle cx="90" cy="210" r="25" fill="#047857"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Mẹ Nhu – người mẹ chở che</text><text x="140" y="244" font-size="16" fill="#334155">Mẹ Nhu được ghi nhớ qua sự chở che và lòng dũng cảm.</text><circle cx="90" cy="315" r="25" fill="#047857"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Sự kiện Thanh Khê năm 1968</text><text x="140" y="349" font-size="16" fill="#334155">Sự kiện Mẹ Nhu và 7 dũng sĩ Thanh Khê gắn với 26/12/1968, không phải năm</text><text x="140" y="374" font-size="16" fill="#334155">1945.</text><circle cx="90" cy="420" r="25" fill="#047857"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Mẹ Nguyễn Thị Thứ</text><text x="140" y="454" font-size="16" fill="#334155">Mẹ Nguyễn Thị Thứ và Mẹ Nhu là hai nhân vật khác nhau.</text><circle cx="90" cy="525" r="25" fill="#047857"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Tri ân bằng hiểu biết và việc làm</text><text x="140" y="559" font-size="16" fill="#334155">Tri ân bắt đầu từ hiểu đúng, ứng xử trang trọng và hành động phù hợp.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>