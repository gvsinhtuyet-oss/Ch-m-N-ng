<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Giữ rừng để giữ cây quý</title><rect width="960" height="720" rx="30" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="24" y="24" width="912" height="672" rx="26" fill="white"/><rect x="40" y="40" width="880" height="108" rx="20" fill="#047857"/><text x="66" y="88" font-size="27" fill="white">Giữ rừng để giữ cây quý</text><text x="66" y="182" font-size="19" fill="#047857">Hành trình khối 5</text><rect x="54" y="208" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="238" r="20" fill="#047857"/><text x="79" y="245" font-size="21" fill="white">1</text><text x="123" y="239" font-size="22" fill="#334155">Gặp cây sâm Ngọc Linh</text><text x="123" y="269" font-size="16" fill="#334155">Là loài cây quý, có giá trị đa dạng sinh học.</text><rect x="54" y="311" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="341" r="20" fill="#047857"/><text x="79" y="348" font-size="21" fill="white">2</text><text x="123" y="342" font-size="22" fill="#334155">Cây quý dưới tán rừng</text><text x="123" y="372" font-size="16" fill="#334155">Cây cần môi trường sinh thái phù hợp dưới tán rừng.</text><rect x="54" y="414" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="444" r="20" fill="#047857"/><text x="79" y="451" font-size="21" fill="white">3</text><text x="123" y="445" font-size="22" fill="#334155">Giá trị và công sức gìn giữ</text><text x="123" y="475" font-size="16" fill="#334155">Nguồn gen, môi trường rừng và sinh kế có trách nhiệm.</text><rect x="54" y="517" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="547" r="20" fill="#047857"/><text x="79" y="554" font-size="21" fill="white">4</text><text x="123" y="548" font-size="22" fill="#334155">Người tìm hiểu có trách nhiệm</text><text x="123" y="578" font-size="16" fill="#334155">Bảo vệ rừng và tôn trọng công sức người chăm sóc.</text><text x="55" y="674" font-size="17" fill="#475569">Sơ đồ học tập · Không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>