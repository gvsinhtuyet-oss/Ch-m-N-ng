<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Hai cảnh biển, một tình yêu quê hương</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#0369a1"/><text x="75" y="92" font-size="28" fill="white">Hai cảnh biển, một tình yêu quê hương</text><path d="M70 380Q220 300 370 380T670 380T900 380V560H70Z" fill="#7dd3fc"/><path d="M70 530Q300 440 490 560H70" fill="#fde68a"/><path d="M560 525l65-130 65 45 70-100 100 185z" fill="#475569"/><circle cx="780" cy="265" r="45" fill="#fbbf24"/><text x="75" y="625" font-size="20" fill="#334155">Quan sát · So sánh · Vận dụng · Cùng chia sẻ</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>