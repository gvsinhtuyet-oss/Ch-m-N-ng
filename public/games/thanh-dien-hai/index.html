<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nhà thám hiểm nhí – Thành Điện Hải</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7f6e6;font-family:system-ui,Arial,sans-serif;color:#2c3428}button{cursor:pointer;touch-action:manipulation;font-family:inherit}main{width:100%;margin:auto;min-height:100dvh;display:flex;align-items:center;justify-content:center}.board{position:relative;width:min(100%,calc(100dvh * 836 / 470));aspect-ratio:836/470;overflow:hidden;background-size:100% 100%;background-position:center;box-shadow:0 14px 40px #223b3340}.hit{position:absolute;border:0;background:transparent;z-index:2;border-radius:18px}.hit:focus-visible{outline:5px solid #0067d5}.hit.good{box-shadow:inset 0 0 0 6px #10b65a,0 0 25px #22f18c;background:#24e88630}.hit.bad{box-shadow:inset 0 0 0 6px #e43a35,0 0 25px #f55850;background:#ff303030;animation:shake .3s}.hit.chosen{box-shadow:inset 0 0 0 4px #ffc326;background:#ffde3d20}.hit.matchcard{border-radius:19px}.hit.q4card{border-radius:6.5% / 8%;}.hit.q4card.good{box-shadow:inset 0 0 0 4px #0dbb54,0 0 12px #15d66c70;background:#10c85c1c}.hit.q4card.bad{box-shadow:inset 0 0 0 4px #e23c38,0 0 12px #f34a4a70;background:#ef303020}.hit.matchcard.good{box-shadow:inset 0 0 0 4px var(--match-color,#10b65a);background:color-mix(in srgb,var(--match-color,#10b65a) 13%,transparent)}.hit.matchcard.bad{box-shadow:inset 0 0 0 4px #e43a35;background:#ff303030}.feedback{position:absolute;z-index:6;left:17%;right:17%;bottom:2%;border-radius:18px;background:#fffbeaee;color:#644012;font-weight:900;text-align:center;padding:9px 14px;box-shadow:0 4px 20px #40210e55;font-size:clamp(12px,2.3vw,21px)}.topline{position:absolute;left:40%;top:1%;z-index:4;background:#fff8e9d9;border-radius:15px;padding:5px 12px;font-size:clamp(10px,1.7vw,17px);font-weight:800}.overlay{position:absolute;inset:0;background:#152f4588;display:flex;align-items:center;justify-content:center;z-index:8;padding:6%}.modal{width:min(95%,510px);background:#fff9e7;border:5px solid #e9ad45;border-radius:25px;text-align:center;padding:22px;box-shadow:0 10px 35px #171a173f}.modal h1{font-size:clamp(22px,4vw,36px);margin:6px 0;color:#a9581c}.modal p{font-size:clamp(14px,2.3vw,19px)}.action{background:linear-gradient(#fff3a6,#ffb12f);border:0;border-bottom:5px solid #ac6b1a;border-radius:18px;padding:13px 22px;font-size:clamp(15px,2.5vw,23px);font-weight:900;color:#673d0d}.matchline{pointer-events:none;position:absolute;inset:0;width:100%;height:100%;z-index:3}.matchline line{stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 1px white)}.matchstatus{position:absolute;left:43%;bottom:5%;width:20%;z-index:5;background:#925018;color:#fff9df;text-align:center;padding:5px 8px;border-radius:16px;font-size:clamp(10px,1.5vw,17px);font-weight:900}.matchconfirm{position:absolute;right:3%;bottom:2%;z-index:6;background:#ffcf53;border:3px solid #aa6819;border-radius:14px;padding:5px 12px;font-size:clamp(11px,1.7vw,18px);font-weight:900;color:#643a0a}.matchconfirm:disabled{opacity:.48;cursor:default}.fire{position:absolute;z-index:7;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;font-size:clamp(18px,4vw,40px);animation:pop 1.6s infinite alternate}.soundstate{position:absolute;right:1%;top:1%;z-index:5;border:0;background:#fff8eccc;border-radius:9px;padding:3px 7px;font-size:clamp(12px,2vw,18px)}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pop{from{opacity:.2;transform:scale(.25) rotate(-15deg)}to{opacity:1;transform:scale(1.5) rotate(25deg)}}@media(max-width:620px){main{align-items:center;padding-top:0}.feedback{left:8%;right:8%;font-size:12px;padding:5px}.modal{padding:12px;border-width:3px}.modal p{margin:7px}.action{padding:9px 12px}}

.victory{position:absolute;inset:0;z-index:10;background:#241b51;display:flex;flex-direction:column;overflow:hidden}
.victoryart{height:100%;width:100%;object-fit:fill;display:block}
.victoryactions{position:absolute;bottom:0;left:0;right:0;height:17%;display:flex;gap:1.5%;align-items:center;justify-content:center;padding:0 2%;background:linear-gradient(100deg,#173b6c,#502b76,#7d3c79);z-index:13}
.victoryactions button{height:77%;flex:1;border:2px solid #ffdc8d;border-radius:18px;font-weight:900;color:white;font-size:clamp(10px,1.9vw,21px);box-shadow:0 3px 0 #2b213c}
.victoryactions button:first-child{background:linear-gradient(#ffbe32,#ee7807)}
.victoryactions button:last-child{background:linear-gradient(#41c5ff,#0474cf)}
.victoryfire{position:absolute;inset:0;pointer-events:none;overflow:hidden;width:100%;height:100%;z-index:11}
.victoryfire span{position:absolute;font-size:clamp(15px,3.3vw,35px);animation:pop 1.3s infinite alternate;filter:drop-shadow(0 0 5px gold)}
.victorymessage{position:absolute;z-index:12;left:29%;top:66%;width:42%;height:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center;padding:1%;border-radius:12px;background:linear-gradient(135deg,#fff3d8,#ffefbb);border:2px solid #e5ad53;color:#6a2c0a;box-shadow:0 3px 14px #6e3b2b3a}.victorymessage strong{font-size:clamp(10px,2.4vw,26px);line-height:1.1}.victorymessage span{font-size:clamp(8px,1.35vw,15px);line-height:1.1}.q2-correct-text{position:absolute;z-index:1;left:52%;top:42%;width:34%;height:13%;display:flex;align-items:center;background:#fffef6;color:#102b51;font-weight:900;font-size:clamp(9px,2.1vw,22px);line-height:1.2;text-align:left}.answer-tile{position:absolute;z-index:1;pointer-events:none;background-repeat:no-repeat;border-radius:14px}
.q2labels{position:absolute;inset:0;z-index:2;pointer-events:none}.q2label{position:absolute;left:49.2%;width:36.8%;height:13%;background:#fff9ed;color:#12315b;display:flex;align-items:center;padding:0 1.4% 0 3.6%;font-weight:900;font-size:clamp(9px,1.85vw,19px);line-height:1.15;text-align:left}.q2label:first-child{font-size:clamp(9px,1.75vw,18px)}
.photo-number{position:absolute;z-index:2;pointer-events:none;display:flex;justify-content:center;align-items:center;height:8.5%;background:#fff9ec;color:#17385b;font-size:clamp(10px,2.1vw,24px);font-weight:1000;text-align:center}
/* Fixed 3D question 2: render every answer as a real accessible text button,
   completely covering the original printed text without slicing the artwork. */
.hit.q2-option{z-index:4;display:flex;align-items:center;gap:3%;padding:0 3%;border:3px solid #e8af43;border-radius:999px;background:linear-gradient(#fffdf6,#fff9e7);box-shadow:0 3px 0 #b67f29,0 0 0 2px #fff9de inset;color:#102956;font-weight:900;text-align:left;line-height:1.15;font-size:clamp(11px,2.06vw,22px)}
.hit.q2-option .q2-letter{display:grid;place-items:center;flex:0 0 auto;width:11%;min-width:28px;aspect-ratio:1;border-radius:50%;font-size:clamp(13px,2.7vw,31px);color:white;text-shadow:0 1px 2px #6a3a1555;box-shadow:inset 0 -3px 0 #0002,0 2px 4px #0002}
.hit.q2-option-0 .q2-letter{background:linear-gradient(#7cde88,#31a744)}
.hit.q2-option-1 .q2-letter{background:linear-gradient(#ffbe44,#fa7300)}
.hit.q2-option-2 .q2-letter{background:linear-gradient(#ef71fc,#b40add)}
.hit.q2-option .q2-copy{flex:1;min-width:0;overflow-wrap:break-word}
.hit.q2-option.good{background:linear-gradient(#edffef,#caffd2);border-color:#10ac56;box-shadow:inset 0 0 0 4px #1ac264,0 0 20px #30e682a0}
.hit.q2-option.bad{background:linear-gradient(#fff4f0,#ffdddd);border-color:#e23636;box-shadow:inset 0 0 0 4px #e54040,0 0 17px #f55a5a90}
.victoryactions{left:19.4%;right:auto;bottom:2.7%;width:61.5%;height:10.5%;padding:0;gap:7%;background:transparent;z-index:13}
.victoryactions button,.victoryactions button:first-child,.victoryactions button:last-child{opacity:0;height:100%;background:transparent;border:0;box-shadow:none;border-radius:20px;cursor:pointer}
.victoryactions button:focus-visible{opacity:.45;outline:4px solid white;outline-offset:2px}
.victorymessage{top:66%;height:19%;left:32%;width:36%;padding:1%;background:linear-gradient(130deg,#fff2d2,#ffedbf);border-radius:14px}
@media(max-width:650px){.hit.q2-option{border-width:2px;padding:0 2%;font-size:clamp(10px,2.3vw,14px)}.hit.q2-option .q2-letter{min-width:19px;font-size:clamp(12px,2.7vw,18px)}}

function stopFireworks(){if(fireFrame)cancelAnimationFrame(fireFrame);fireFrame=0;fireParticles=[];fireCanvas=null}
function startFireworks(canvas){stopFireworks();fireCanvas=canvas;const ctx=canvas.getContext('2d');if(!ctx)return;
 function resize(){const b=canvas.getBoundingClientRect();canvas.width=Math.max(400,Math.round(b.width));canvas.height=Math.max(230,Math.round(b.height))}
 resize();const palette=['#ffdb6a','#fff6d1','#fc58cd','#71e7ff','#85ffb6','#ff9b55','#a88cff'];
 function burst(){const x=canvas.width*(.13+Math.random()*.74),y=canvas.height*(.06+Math.random()*.47),tone=palette[Math.floor(Math.random()*palette.length)];for(let i=0;i<62;i++){let a=2*Math.PI*i/62,spd=1.7+Math.random()*2.9;fireParticles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,r:1+Math.random()*2.1,color:i%5===0?'#fffdec':tone})}fireParticles=fireParticles.slice(-600)}
 function draw(t){if(!fireCanvas||!fireCanvas.isConnected){stopFireworks();return}if(canvas.width<200)resize();ctx.clearRect(0,0,canvas.width,canvas.height);if(t-fireLast>480){fireLast=t;burst()}for(const p of fireParticles){p.x+=p.vx;p.y+=p.vy;p.vy+=.017;p.vx*=.993;p.life-=.012;ctx.globalAlpha=Math.max(0,p.life);ctx.shadowBlur=17;ctx.shadowColor=p.color;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;fireParticles=fireParticles.filter(p=>p.life>0);fireFrame=requestAnimationFrame(draw)}fireFrame=requestAnimationFrame(draw)
}
function notifyGameComplete(){if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-complete',stationId:'g1-station-4'},window.location.origin)}
function continueJourney(){stopVictoryMusic();stopFireworks();if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-continue',stationId:'g1-station-4'},window.location.origin);else home()}
function next(){step++;if(step<sequence.length){show();return}if(wrong.size){let missed=[...wrong].sort();board.innerHTML='';modal('🔎 TRUY LẠI DẤU VẾT','Em còn '+missed.length+' thử thách cần hoàn thành lại.','🔍 THỬ LẠI',()=>{review=true;sequence=missed;step=0;show()})}else{
 notifyGameComplete();board.innerHTML='';board.style.backgroundImage='none';
 let v=document.createElement('div');v.className='victory';
 v.innerHTML='<img class="victoryart" alt="Chúc mừng em đã hoàn thành thử thách Thành Điện Hải" src="'+VICTORY+'"><div class="victorymessage"><strong>Em thật tuyệt vời!</strong><span>Hãy tiếp tục khám phá những điều thú vị tiếp theo nhé!</span></div><canvas class="victoryfire" aria-hidden="true"></canvas><div class="victoryactions"><button id="vreplay">🔄 Chơi lại</button><button id="vcontinue">➡️ Tiếp tục hành trình</button></div>';
 board.appendChild(v);v.querySelector('#vcontinue').onclick=continueJourney;v.querySelector('#vreplay').onclick=()=>{stopFireworks();home();sequence=[0,1,2,3];step=0;show()};
 startFireworks(v.querySelector('canvas'));song();victoryMusicTimer=setInterval(()=>{if(!mute&&board.querySelector('.victory'))song()},6500);speak('Chúc mừng em! Em đã hoàn thành thử thách khám phá Thành Điện Hải!')
}}

home();
</script></body></html>
