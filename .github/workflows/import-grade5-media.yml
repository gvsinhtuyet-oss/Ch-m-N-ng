name: Import reviewed Grade 5 photographs
on:
  push:
    paths:
      - '.github/workflows/import-grade5-media.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import-grade5-photos.py
      - name: Prepare temporary UTF-8 transfer for local visual QA
        run: |
          python - <<'PYCODE'
          import base64,pathlib,json
          root=pathlib.Path('content-review/grade5-transfer');root.mkdir(exist_ok=True)
          for m in json.loads(pathlib.Path('content-review/grade5-media-sources.json').read_text()):
              (root/(m['id']+'.txt')).write_text(base64.b64encode(pathlib.Path('public'+m['src']).read_bytes()).decode())
          PYCODE
      - name: Commit only licensed static media and integrity records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/learning/grade5/photos content-review/grade5-media-integrity.json content-review/grade5-transfer
          git commit -m 'Import reviewed Grade 5 river and restored Hai Van Quan photographs'
          git pull --rebase origin main
          git push origin HEAD:main

# Re-select the view facing the restored gate after visual review.
