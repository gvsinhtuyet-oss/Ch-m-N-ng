<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="216" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="190" stroke="rgba(56,189,248,0.25)" stroke-width="2" fill="none" />

  <!-- Mountain Silhouette (Ngũ Hành Sơn & Sơn Trà) -->
  <path d="M70 380 Q130 270 190 340 Q250 240 320 350 Q390 280 442 380 Z" fill="#047857" opacity="0.6" />
  <path d="M120 385 Q190 290 260 365 Q330 300 410 385 Z" fill="#059669" opacity="0.8" />

  <!-- Han River Water Waves -->
  <path d="M50 420 Q120 395 190 420 T330 420 T462 420 L462 460 Q390 475 320 460 T180 460 T50 460 Z" fill="url(#waveGrad)" opacity="0.9" />
  <path d="M50 440 Q130 425 210 440 T370 440 T462 440 L462 470 Q390 485 310 470 T150 470 T50 470 Z" fill="#0284c7" />

  <!-- Iconic Dragon Bridge Arch (Cầu Rồng) -->
  <path d="M110 320 Q200 130 290 220 Q350 160 410 240" fill="none" stroke="url(#dragonGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="410" cy="240" r="14" fill="#fbbf24" filter="url(#glow)" />
  
  <!-- Bridge Stays / Texture -->
  <path d="M160 270 L160 350 M210 210 L210 360 M260 210 L260 360 M310 230 L310 360 M360 210 L360 365" stroke="rgba(253,224,71,0.5)" stroke-width="4" stroke-linecap="round" />

  <!-- Radiant Discovery Compass Star / Touch Beacon -->
  <g transform="translate(256, 130)">
    <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10" fill="#facc15" filter="url(#glow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Touch Ripple Indicator (Chạm) -->
  <circle cx="256" cy="130" r="54" stroke="rgba(250,204,21,0.4)" stroke-width="2.5" fill="none" stroke-dasharray="4 4" />
</svg>
