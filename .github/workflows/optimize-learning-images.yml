name: Optimize learning images
on:
  push:
    paths:
      - 'scripts/optimize_learning_images.py'
      - '.github/workflows/optimize-learning-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Compress existing images without changing their paths
        run: python scripts/optimize_learning_images.py
      - name: Commit optimized images
        run: |
          if git diff --quiet -- public; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Optimize learning images without changing app routes or auth"
          git push
