<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Giọt mắm và công sức người làm nghề</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#b45309"/><text x="75" y="92" font-size="28" fill="white">Giọt mắm và công sức người làm nghề</text><circle cx="90" cy="200" r="24" fill="#b45309"/><text x="82" y="209" font-size="24" fill="white">1</text><text x="135" y="200" font-size="24" fill="#334155">Nam Ô – nghề làm nước mắm</text><text x="135" y="232" font-size="17" fill="#334155">Nước mắm Nam Ô là sản phẩm gắn với nghề truyền thống địa phương.</text><circle cx="90" cy="305" r="24" fill="#b45309"/><text x="82" y="314" font-size="24" fill="white">2</text><text x="135" y="305" font-size="24" fill="#334155">Cá cơm than và muối</text><text x="135" y="337" font-size="17" fill="#334155">Nguyên liệu tiêu biểu là cá cơm than và muối.</text><circle cx="90" cy="410" r="24" fill="#b45309"/><text x="82" y="419" font-size="24" fill="white">3</text><text x="135" y="410" font-size="24" fill="#334155">Từ nguyên liệu đến sản phẩm</text><text x="135" y="442" font-size="17" fill="#334155">Ủ chượp cần thời gian; sản phẩm trải qua nhiều công đoạn.</text><circle cx="90" cy="515" r="24" fill="#b45309"/><text x="82" y="524" font-size="24" fill="white">4</text><text x="135" y="515" font-size="24" fill="#334155">Dùng hợp lí, quý người làm nghề</text><text x="135" y="547" font-size="17" fill="#334155">Giữ vệ sinh, chọn sản phẩm rõ nguồn gốc và sử dụng hợp lí.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>