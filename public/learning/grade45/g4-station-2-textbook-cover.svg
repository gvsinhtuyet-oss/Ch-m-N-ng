<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Khu đền tháp Mỹ Sơn – Bảo tàng Điêu khắc Chăm Đà Nẵng</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#92400e"/><g font-family="Arial,sans-serif" fill="#92400e"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Khu đền tháp Mỹ Sơn – Bảo tàng Điêu</text><text x="64" y="170" font-size="32" font-weight="bold">khắc Chăm Đà Nẵng</text><text x="64" y="270" font-size="24" fill="#334155">Từ thung lũng Mỹ Sơn đến những tác phẩm trong bảo tàng</text><text x="64" y="306" font-size="24" fill="#334155"></text><text x="64" y="342" font-size="24" fill="#334155">Khám phá · Thử thách · Cảm xúc · Hộ chiếu</text><text x="64" y="378" font-size="24" fill="#334155"></text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>