<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1065"><title>Từ lá dâu đến tấm lụa</title><rect width="960" height="1065" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="1025" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Từ lá dâu đến tấm lụa</text><rect x="48" y="175" width="864" height="151" rx="14" fill="#f0fdf4"/><text x="65" y="207" font-size="23" fill="#047857">1. Làng lụa ở Nam Phước</text><text x="65" y="265" font-size="18" fill="#334155">Mã Châu là làng nghề dệt lụa truyền thống ở xã Nam Phước, thành phố Đà Nẵng.</text><rect x="48" y="340" width="864" height="151" rx="14" fill="#f0fdf4"/><text x="65" y="372" font-size="23" fill="#047857">2. Trồng dâu và nuôi tằm</text><text x="65" y="430" font-size="18" fill="#334155">Tằm ăn lá dâu, lớn lên rồi nhả tơ tạo kén; nuôi tằm là một công đoạn của nghề lụa.</text><rect x="48" y="505" width="864" height="151" rx="14" fill="#f0fdf4"/><text x="65" y="537" font-size="23" fill="#047857">3. Bủa kén và ươm tơ</text><text x="65" y="595" font-size="18" fill="#334155">Bủa kén tạo tổ kén; ươm tơ là công đoạn lấy sợi tơ từ kén để chuẩn bị dệt.</text><rect x="48" y="670" width="864" height="151" rx="14" fill="#f0fdf4"/><text x="65" y="702" font-size="23" fill="#047857">4. Dệt và hoàn thiện tấm lụa</text><text x="65" y="760" font-size="18" fill="#334155">Quy trình chính gồm nuôi tằm → bủa kén, ươm tơ → dệt lụa → hoàn thiện sản phẩm.</text><rect x="48" y="835" width="864" height="151" rx="14" fill="#f0fdf4"/><text x="65" y="867" font-size="23" fill="#047857">5. Sản phẩm và cách giữ nghề</text><text x="65" y="925" font-size="18" fill="#334155">Lụa Mã Châu có nhiều loại sản phẩm, nổi bật ở hoa văn, phối màu và sự khéo léo của</text><text x="65" y="953" font-size="18" fill="#334155">người thợ.</text><text x="55" y="1025" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>