<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Tìm hiểu nét văn hóa</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#be185d"/><text x="75" y="92" font-size="28" fill="white">Tìm hiểu nét văn hóa</text><circle cx="480" cy="420" r="140" fill="#fce7f3"/><circle cx="260" cy="340" r="35" fill="#0284c7"/><path d="M215 440q45-95 90 0" fill="#0284c7"/><circle cx="480" cy="280" r="35" fill="#be185d"/><path d="M435 380q45-95 90 0" fill="#be185d"/><circle cx="700" cy="340" r="35" fill="#059669"/><path d="M655 440q45-95 90 0" fill="#059669"/><text x="75" y="625" font-size="20" fill="#334155">Đọc chú thích để gọi đúng tên hiện vật và cộng đồng.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>