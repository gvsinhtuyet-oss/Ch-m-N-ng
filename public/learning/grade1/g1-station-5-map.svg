<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Một tô mì, bao điều yêu thương</title><rect width="960" height="720" fill="#fff7ed"/><g font-family="Arial, sans-serif"><rect x="32" y="32" width="896" height="656" rx="35" fill="white"/><rect x="55" y="55" width="850" height="90" rx="24" fill="#be123c"/><text x="85" y="109" font-size="30" fill="white">Một tô mì, bao điều yêu thương</text><circle cx="110" cy="202" r="30" fill="#be123c"/><text x="100" y="214" font-size="32" fill="white">1</text><text x="160" y="198" font-size="27" fill="#334155">Món ngon quê hương</text><text x="160" y="233" font-size="18" fill="#334155">Quê hương có nhiều món ăn truyền thống.</text><circle cx="110" cy="307" r="30" fill="#be123c"/><text x="100" y="319" font-size="32" fill="white">2</text><text x="160" y="303" font-size="27" fill="#334155">Nguyên liệu món mì Quảng</text><text x="160" y="338" font-size="18" fill="#334155">Sợi mì cùng các nguyên liệu tạo nên món mì Quảng.</text><circle cx="110" cy="412" r="30" fill="#be123c"/><text x="100" y="424" font-size="32" fill="white">3</text><text x="160" y="408" font-size="27" fill="#334155">Bày tô mì và thưởng thức</text><text x="160" y="443" font-size="18" fill="#334155">Có thể thưởng thức mì Quảng cùng rau và bánh tráng nướng.</text><circle cx="110" cy="517" r="30" fill="#be123c"/><text x="100" y="529" font-size="32" fill="white">4</text><text x="160" y="513" font-size="27" fill="#334155">Đầu bếp siêu hạng</text><text x="160" y="548" font-size="18" fill="#334155">Em có thể giới thiệu món ăn bằng tranh và lời kể.</text><text x="70" y="660" font-size="19" fill="#64748b">CHẠM ĐÀ NẴNG · Sơ đồ minh họa, không phải ảnh tư liệu</text></g></svg>