 {id:'q2',kind:'multi',label:'NHIỆM VỤ 2 · KHÁM PHÁ RẠN SAN HÔ',title:'Tìm hai hình ảnh thuộc rạn san hô.',desc:'Chọn đủ hai hình rồi xác nhận.',choices:[{icon:'🐠',alt:'Cá biển'},{icon:'🪸',alt:'San hô'},{icon:'🧴',alt:'Chai nhựa'},{icon:'🛍️',alt:'Túi nhựa'}],answer:[0,1],hint:'Hãy phân biệt sinh vật biển với đồ vật do con người mang tới.'},
 {id:'q3',kind:'clean',label:'NHIỆM VỤ 3 · DỌN SẠCH BÃI BIỂN',title:'Cùng gom rác trên bãi cát!',desc:'Đưa ba món rác vào giỏ. Hãy để sinh vật và vỏ ốc ở lại với thiên nhiên.',items:[{icon:'🧴',name:'Chai nhựa',trash:true},{icon:'🛍️',name:'Túi nhựa',trash:true},{icon:'🥫',name:'Lon nước',trash:true},{icon:'🐚',name:'Vỏ ốc',trash:false},{icon:'⭐',name:'Sao biển',trash:false}],hint:'Hãy phân biệt rác thải với sinh vật biển và vỏ ốc.'},
 {id:'q4',kind:'match',label:'NHIỆM VỤ 4 · NỐI CẢNH QUAN',title:'Nối cảnh quan với hình ảnh phù hợp.',desc:'Ghép đủ ba cặp rồi xác nhận.',left:['Rạn san hô','Rừng trên đảo','Bãi cát'],right:[{icon:'🌿',text:'Cây xanh'},{icon:'🐟',text:'Cá biển'},{icon:'🐚',text:'Vỏ ốc'}],answer:[1,0,2],hint:'Hãy nghĩ xem mỗi cảnh quan thường có những gì ở gần nó.',pairHints:['Hãy hình dung điều gì đang bơi quanh những nhánh san hô.','Nhớ đến những gì mọc thành rừng trên đảo.','Hãy nghĩ xem sóng biển có thể đưa vật gì nhỏ lên bờ.']},
 {id:'q5',kind:'pick',label:'NHIỆM VỤ 5 · DU LỊCH XANH',title:'Em chọn cách tham quan nào để giữ đảo xanh sạch?',desc:'Chọn một việc thể hiện sự quan tâm đến biển đảo.',choices:[['🧃','Mang chai nước dùng lại nhiều lần'],['🪸','Bẻ san hô làm kỷ niệm'],['🛍️','Để túi nhựa trên bãi cát'],['🖍️','Khắc tên lên đá']],answer:0,hint:'Hãy chọn việc giúp giảm rác và giữ thiên nhiên nguyên vẹn.'}
];
const root=document.getElementById('root'),soundBtn=document.getElementById('soundBtn');let mode='intro',idx=0,wrong=[],reviewAt=0,solved=Array(qs.length).fill(false),locked=false,soundOn=true,victoryAudio=null,victoryAudioStarted=false,fireworkFrame=0,fireworkRAF=0,fireworksResizeHandler=null,autoTimer=0,choiceOrder=[],rightOrder=[],multiSelected=[],basketItems=[],cleanWrong=[],dragItem=null,selectedSide=null,pairs=[],pairResult=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ctx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=new C();c.resume?.();return c}
function beep(freq,dur=.11,type='sine',vol=.18,delay=0){if(!soundOn)return;try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);setTimeout(()=>c.close(),Math.max(600,(delay+dur+.1)*1000))}catch(e){}}
function answerSound(ok){if(!soundOn)return;try{const c=ctx(),now=c.currentTime;if(ok){[[659,0],[880,.12],[1047,.24],[1319,.36]].forEach(([f,d])=>beepIn(c,f,.3,'triangle',.22,d));beepIn(c,1976,.42,'sine',.095,.06)}else{beepIn(c,392, .24,'triangle',.24,0);beepIn(c,294,.34,'triangle',.23,.2)}setTimeout(()=>c.close(),1100)}catch(e){}}
function beepIn(c,f,d,type,v,delay){const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(!f)return;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.025)}
function playVictory(){if(!soundOn)return;if(victoryAudioStarted){if(victoryAudio&&victoryAudio.paused&&!victoryAudio.ended)victoryAudio.play().catch(()=>{});return}victoryAudioStarted=true;try{victoryAudio=new Audio('./victory-game.mp3');victoryAudio.loop=false;victoryAudio.volume=.92;victoryAudio.play().catch(()=>answerSound(true))}catch(e){answerSound(true)}}
function stopVictory(){if(victoryAudio){victoryAudio.pause();victoryAudio.currentTime=0}victoryAudio=null;victoryAudioStarted=false;stopFireworks()}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.setAttribute('aria-label',soundOn?'Tắt âm thanh':'Bật âm thanh');if(!soundOn&&victoryAudio)victoryAudio.pause();else if(soundOn&&mode==='victory')playVictory()};
function intro(){root.innerHTML=`<section class="intro"><div class="introCard"><div class="introSeal">🐠</div><span class="eyebrow">TRẠM CÙ LAO CHÀM · KHỐI 2</span><h1>Biệt đội xanh<br>cứu đảo</h1><p>Khám phá biển đảo, chăm sóc rạn san hô và cùng nhau giữ bãi biển luôn xanh sạch.</p><button class="startBtn" id="start">RA KHƠI KHÁM PHÁ</button><div class="introBadges"><span>🏝️ 5 nhiệm vụ</span><span>🪸 Chạm · kéo thả · ghép cặp</span><span>✨ Thắp sáng rạn san hô</span></div></div></section>`;document.getElementById('start').onclick=()=>{mode='first';idx=0;wrong=[];solved=Array(qs.length).fill(false);openQuestion()}}
function current(){return mode==='review'?qs[wrong[reviewAt]]:qs[idx]}
function tokens(){return qs.map((_,i)=>`<span class="shellToken ${solved[i]?'lit':''}" id="token${i}">🐚</span>`).join('')}
function layout(q){const n=mode==='review'?`TRUY LẠI DẤU VẾT ${reviewAt+1} / ${wrong.length}`:`NHIỆM VỤ ${idx+1} / 5`;let progress=solved.filter(Boolean).length;return `<section class="gameLayout"><div class="scenePanel" id="scene"><div class="sceneTop"><span class="sceneLabel">🌊 KHU VƯỜN DƯỚI BIỂN</span><div class="islandProgress">${tokens()}</div></div><div class="sceneCenter"><div class="reefIcon">🪸</div><div class="reefTitle">Rạn san hô đang chờ em</div><div class="reefSub">Mỗi dấu vết đúng thắp sáng một góc đảo</div></div><div class="sceneBottom"><span class="progressText">Đã khôi phục ${progress}/5 dấu xanh</span><div class="progressBar"><div class="progressFill" style="width:${progress*20}%"></div></div></div></div><section class="questionPanel"><div class="questHud"><span class="questNumber">${n}</span><span class="questMode">Hãy quan sát thật kĩ ✨</span></div><article class="questCard"><span class="qTag">${q.label}</span><h2>${q.title}</h2><p class="qDesc">${q.desc}</p>${task(q)}<div class="feedback" id="feedback" aria-live="polite"></div>${q.kind==='multi'?'<div class="actions"><button class="mainBtn" id="confirm" disabled>XÁC NHẬN LỰA CHỌN</button></div>':''}${q.kind==='clean'?'<div class="actions"><button class="mainBtn" id="confirm" disabled>THẢ RÁC VÀO GIỎ</button></div>':''}${q.kind==='match'?'<div class="actions"><button class="mainBtn" id="confirm" disabled>XÁC NHẬN CÁC CẶP</button></div>':''}</article></section></section>`}
function task(q){if(q.kind==='image')return `<div class="imageChoices">${choiceOrder.map(i=>`<button class="imageChoice" data-choice="${i}" aria-label="${q.choices[i].alt}"><span class="art ${q.choices[i].class}"></span></button>`).join('')}</div>`;if(q.kind==='multi')return `<div class="multiGrid">${q.choices.map((c,i)=>`<button class="multiChoice" data-choice="${i}" aria-label="${c.alt}"><span class="emoji">${c.icon}</span></button>`).join('')}</div><div class="helper">Chọn sinh vật biển rồi xác nhận một lần.</div>`;if(q.kind==='clean')return `<div class="cleanBoard"><div class="beachTray">${choiceOrder.map(i=>`<button class="trashItem" draggable="true" data-item="${i}" aria-label="${q.items[i].name}" title="${q.items[i].name}">${q.items[i].icon}</button>`).join('')}</div><div class="basket" id="basket" role="button" tabindex="0" aria-label="Giỏ nhặt rác">🧺<small>GIỎ NHẶT RÁC</small><div class="basketItems" id="basketItems"></div></div></div><div class="helper" id="cleanHelper">Chạm một món rồi chạm vào giỏ; hoặc kéo thả trực tiếp.</div>`;if(q.kind==='match')return `<div class="matching"><div class="matchCol"><div class="matchHeading">CẢNH QUAN</div>${q.left.map((x,i)=>`<button class="matchItem" data-side="left" data-i="${i}">${x}</button>`).join('')}</div><div class="matchCol"><div class="matchHeading">HÌNH ẢNH</div>${rightOrder.map((originalI,displayI)=>`<button class="matchItem" data-side="right" data-i="${displayI}">${q.right[originalI].icon} ${q.right[originalI].text}</button>`).join('')}</div></div><div class="helper" id="matchHelper">Chạm một cảnh quan rồi chọn hình ảnh phù hợp.</div><div class="matchHints" id="matchHints"></div>`;return `<div class="pickGrid">${choiceOrder.map(i=>`<button class="pickChoice" data-choice="${i}"><span class="emoji">${q.choices[i][0]}</span><span>${q.choices[i][1]}</span></button>`).join('')}</div>`}
function openQuestion(){if(mode==='summary'){summary();return}if(mode==='victory'){victory();return}if(mode==='intro'){intro();return}locked=false;const q=current();choiceOrder=q.choices?shuffle(q.choices.map((_,i)=>i)):q.items?shuffle(q.items.map((_,i)=>i)):[];rightOrder=q.kind==='match'?shuffle(q.right.map((_,i)=>i)):[];multiSelected=[];basketItems=[];cleanWrong=[];selectedSide=null;pairs=q.kind==='match'?[null,null,null]:[];pairResult=q.kind==='match'?[null,null,null]:[];root.innerHTML=layout(q);if(q.kind==='image'||q.kind==='pick')wireSingle(q);if(q.kind==='multi')wireMulti(q);if(q.kind==='clean')wireClean(q);if(q.kind==='match')wireMatch(q)}
function feedback(text,kind){const el=document.getElementById('feedback');if(el){el.textContent=text;el.className=`feedback ${kind||''}`}}
function wireSingle(q){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(locked)return;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('correct','wrong'));const i=+b.dataset.choice,ok=i===q.answer;b.classList.add(ok?'correct':'wrong');grade(q,ok)})}
function wireMulti(q){const btn=document.getElementById('confirm');document.querySelectorAll('.multiChoice').forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.choice;if(multiSelected.includes(i))multiSelected=multiSelected.filter(x=>x!==i);else if(multiSelected.length<2)multiSelected.push(i);b.classList.toggle('selected',multiSelected.includes(i));b.classList.remove('wrong','correct');btn.disabled=multiSelected.length!==2;feedback(multiSelected.length===2?'Đã chọn đủ hai hình. Em có thể đổi lựa chọn trước khi xác nhận.':'Hãy chọn hai hình rồi xác nhận.','')});btn.onclick=()=>{if(locked)return;const ok=multiSelected.length===2&&q.answer.every(i=>multiSelected.includes(i));document.querySelectorAll('.multiChoice').forEach(b=>{if(multiSelected.includes(+b.dataset.choice))b.classList.add(ok?'correct':'wrong')});grade(q,ok)}}
function wireClean(q){const basket=document.getElementById('basket'),confirm=document.getElementById('confirm');function paintClean(){document.querySelectorAll('.trashItem').forEach(b=>{const i=+b.dataset.item;b.classList.toggle('inBasket',basketItems.includes(i));b.classList.toggle('selected',dragItem===i)});basket.classList.toggle('ready',basketItems.length>0);document.getElementById('basketItems').innerHTML=basketItems.map(i=>`<button class="basketItem ${cleanWrong.includes(i)?'wrong':''}" data-return="${i}" aria-label="Trả ${q.items[i].name} về bãi cát">${q.items[i].icon}</button>`).join('');document.querySelectorAll('[data-return]').forEach(b=>b.onclick=e=>{e.stopPropagation();basketItems=basketItems.filter(i=>i!==+b.dataset.return);cleanWrong=cleanWrong.filter(x=>x!==+b.dataset.return);paintClean()});confirm.disabled=basketItems.length!==3}
function addToBasket(i){if(i==null||basketItems.includes(i))return;basketItems.push(i);dragItem=null;paintClean()}document.querySelectorAll('.trashItem').forEach(b=>{b.onclick=()=>{if(locked||basketItems.includes(+b.dataset.item))return;const i=+b.dataset.item;if(dragItem===i)addToBasket(i);else{dragItem=i;document.getElementById('cleanHelper').textContent=`Đã nhặt ${q.items[i].name}. Chạm giỏ để đặt vào.`;paintClean()}};b.ondragstart=e=>{dragItem=+b.dataset.item;e.dataTransfer?.setData('text/plain',String(dragItem));if(e.dataTransfer)e.dataTransfer.effectAllowed='move'};b.ondragend=()=>{setTimeout(()=>{dragItem=null;paintClean()},100)}});basket.onclick=()=>{if(locked)return;if(dragItem!==null)addToBasket(dragItem);else if(basketItems.length)feedback('Chạm một món trong giỏ để trả lại bãi cát.','')};basket.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();basket.click()}};basket.ondragover=e=>{e.preventDefault();basket.classList.add('over')};basket.ondragleave=()=>basket.classList.remove('over');basket.ondrop=e=>{e.preventDefault();basket.classList.remove('over');const i=Number(e.dataTransfer?.getData('text/plain'));addToBasket(Number.isFinite(i)?i:dragItem)};confirm.onclick=()=>{if(locked)return;const ok=basketItems.length===3&&basketItems.every(i=>q.items[i].trash);cleanWrong=ok?[]:basketItems.filter(i=>!q.items[i].trash);paintClean();grade(q,ok)};paintClean()}
function wireMatch(q){const items=[...document.querySelectorAll('.matchItem')],btn=document.getElementById('confirm'),helper=document.getElementById('matchHelper'),hintBox=document.getElementById('matchHints');function paint(message){items.forEach(b=>{const side=b.dataset.side,i=+b.dataset.i,leftI=side==='left'?i:pairs.indexOf(rightOrder[i]),hasPair=side==='left'?pairs[i]!==null:leftI>=0,res=leftI<0?null:pairResult[leftI],selected=selectedSide?.side===side&&selectedSide.index===i;b.classList.remove('correct','wrong','paired','pairColor0','pairColor1','pairColor2');b.classList.toggle('active',selected);if(hasPair&&leftI>=0){if(res==='correct')b.classList.add('correct');else if(res==='wrong')b.classList.add('wrong');else b.classList.add('paired',`pairColor${leftI%3}`)}});btn.disabled=pairs.some(x=>x===null);if(helper)helper.textContent=message||(selectedSide?'Đã chọn một hình. Chọn cảnh quan ở cột bên kia.':`Đã nối ${pairs.filter(x=>x!==null).length}/3 cặp.`);hintBox.innerHTML=pairResult.map((state,i)=>state==='wrong'?`<div class="matchHint">Gợi ý cho cặp “${q.left[i]}”: ${q.pairHints?.[i]||q.hint}</div>`:'').join('')}items.forEach(b=>b.onclick=()=>{if(locked)return;const side=b.dataset.side,i=+b.dataset.i;if(side==='left'&&pairResult[i]==='correct'||side==='right'&&pairResult[pairs.indexOf(rightOrder[i])]==='correct')return;if(!selectedSide){selectedSide={side,index:i};beep(500,.08,'sine',.07);paint();return}if(selectedSide.side===side){selectedSide={side,index:i};paint();return}const li=side==='left'?i:selectedSide.index,ri=side==='right'?rightOrder[i]:rightOrder[selectedSide.index];const old=pairs.indexOf(ri);if(old!==-1&&old!==li){pairs[old]=null;pairResult[old]=null}pairs[li]=ri;pairResult[li]=null;selectedSide=null;beep(680,.08,'sine',.08);paint()});btn.onclick=()=>{if(locked)return;pairResult=pairs.map((v,i)=>v===q.answer[i]?'correct':'wrong');paint('Đã kiểm tra tất cả cặp. Xanh là đúng, đỏ cần truy lại.');grade(q,pairResult.every(x=>x==='correct'))};paint()}
function grade(q,ok){if(locked)return;const qi=qs.indexOf(q);if(ok){locked=true;solved[qi]=true;const allDone=solved.every(Boolean);if(allDone)playVictory();else answerSound(true);feedback(mode==='review'?'Dấu vết đã được khôi phục!':'Chính xác! Một góc đảo vừa sáng lên.','ok');document.getElementById('scene')?.classList.add('hasGlow');document.getElementById(`token${qi}`)?.classList.add('lit');document.querySelector('.progressText')?.replaceChildren(document.createTextNode(`Đã khôi phục ${solved.filter(Boolean).length}/5 dấu xanh`));document.querySelector('.progressFill')?.style.setProperty('width',`${solved.filter(Boolean).length*20}%`);autoTimer=setTimeout(()=>{if(mode==='first'){idx++;if(idx>=qs.length){mode=wrong.length?'summary':'victory';openQuestion()}else openQuestion()}else{wrong=wrong.filter((_,i)=>i!==reviewAt);if(wrong.length===0){mode='victory';openQuestion()}else{reviewAt=Math.min(reviewAt,wrong.length-1);openQuestion()}}},850)}else{answerSound(false);feedback(`Chưa khớp. ${q.hint}`,'bad');if(mode==='first'&&!wrong.includes(qi))wrong.push(qi);if(mode==='first'){locked=true;autoTimer=setTimeout(()=>{idx++;if(idx>=qs.length){mode='summary';openQuestion()}else openQuestion()},2000)}else{locked=true;autoTimer=setTimeout(()=>{locked=false;document.querySelector('.feedback')?.classList.add('bad')},2000)}}}
function summary(){stopFireworks();root.innerHTML=`<section class="summary"><div class="summaryCard"><div class="introSeal">🧭</div><span class="eyebrow">KẾT QUẢ LƯỢT ĐẦU</span><h1>Hành trình khám phá</h1><div class="resultScore">${solved.filter(Boolean).length}<span>/5 dấu xanh đã thắp sáng</span></div><p>Còn ${wrong.length} dấu vết đang chờ em truy lại.</p><div class="tokens">${qs.map((_,i)=>`<span class="token ${solved[i]?'on':''}">${solved[i]?'✦':'?'}</span>`).join('')}</div><button class="mainBtn" id="retry">TRUY LẠI DẤU VẾT</button></div></section>`;document.getElementById('retry').onclick=()=>{mode='review';reviewAt=0;openQuestion()}}
function victory(){root.innerHTML=`<section class="victory"><div class="endingGlow"></div><canvas id="fireworks"></canvas><div class="victoryCard"><div class="introSeal">🪸</div><span class="eyebrow">TRẠM CÙ LAO CHÀM · KHỐI 2</span><h1>Hoàn thành thử thách</h1><div class="resultScore">5<span>/5 dấu xanh đã sáng</span></div><p>Biệt đội xanh đã cùng nhau chăm sóc khu vườn dưới biển!</p><div class="tokens">${qs.map(()=>`<span class="token on">✦</span>`).join('')}</div><button class="mainBtn" id="replay">CHƠI LẠI THỬ THÁCH</button></div></section>`;startFireworks();playVictory();if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-complete',stationId:'g2-station-2'},window.location.origin);document.getElementById('replay').onclick=()=>{stopVictory();clearTimeout(autoTimer);mode='first';idx=0;wrong=[];reviewAt=0;solved=Array(qs.length).fill(false);openQuestion()}}
function startFireworks(){const canvas=document.getElementById('fireworks');if(!canvas||fireworkRAF)return;const c=canvas.getContext('2d');let w=0,h=0,particles=[];function size(){const r=canvas.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;w=canvas.width;h=canvas.height;c.setTransform(d,0,0,d,0,0)}function burst(){const x=Math.random()*canvas.clientWidth,y=Math.random()*canvas.clientHeight*.65+20,col=['#ffe870','#43f4d9','#a8ff8c','#ff8e68','#f8faff'][Math.floor(Math.random()*5)];for(let i=0;i<36;i++){const a=Math.PI*2*i/36,v=Math.random()*3+1.5;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:55+Math.random()*30,color:col,size:Math.random()*3+1})}}function frame(){c.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);if(Math.random()<.055)burst();particles=particles.filter(p=>p.life-->0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.99;c.globalAlpha=Math.max(0,p.life/80);c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill()});c.globalAlpha=1;fireworkRAF=requestAnimationFrame(frame)}size();fireworksResizeHandler=size;window.addEventListener('resize',fireworksResizeHandler,{passive:true});frame()}
function stopFireworks(){if(fireworkRAF)cancelAnimationFrame(fireworkRAF);if(fireworksResizeHandler)window.removeEventListener('resize',fireworksResizeHandler);fireworksResizeHandler=null;fireworkRAF=0}
function stopAll(){clearTimeout(autoTimer);stopVictory()};window.addEventListener('pagehide',stopAll);
intro();
})();
</script>
