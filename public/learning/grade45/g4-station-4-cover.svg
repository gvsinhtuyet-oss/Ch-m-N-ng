<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Giữ tiếng đồng ngân vang</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#0369a1"/><text x="70" y="86" font-size="28" fill="white">Giữ tiếng đồng ngân vang</text><circle cx="90" cy="210" r="25" fill="#0369a1"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Gặp làng nghề Phước Kiều</text><text x="140" y="244" font-size="16" fill="#334155">Phước Kiều gắn với nghề đúc đồng và các nhạc khí truyền thống.</text><circle cx="90" cy="315" r="25" fill="#0369a1"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Từ khuôn đến sản phẩm</text><text x="140" y="349" font-size="16" fill="#334155">Khuôn, kim loại và công đoạn hoàn thiện cùng tạo ra sản phẩm.</text><circle cx="90" cy="420" r="25" fill="#0369a1"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Đôi tai và bàn tay nghệ nhân</text><text x="140" y="454" font-size="16" fill="#334155">Thẩm âm là kĩ năng nghe, kiểm tra và điều chỉnh âm thanh nhạc khí.</text><circle cx="90" cy="525" r="25" fill="#0369a1"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Trân trọng nghề và người thợ</text><text x="140" y="559" font-size="16" fill="#334155">Giữ nghề bằng tìm hiểu trung thực, trân trọng lao động và tham quan an</text><text x="140" y="584" font-size="16" fill="#334155">toàn.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>