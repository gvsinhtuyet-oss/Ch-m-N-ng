<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Dấu tích xưa, lòng biết ơn hôm nay</title><rect width="960" height="720" fill="#fff7ed"/><g font-family="Arial, sans-serif"><rect x="32" y="32" width="896" height="656" rx="35" fill="white"/><rect x="55" y="55" width="850" height="90" rx="24" fill="#0369a1"/><text x="85" y="109" font-size="30" fill="white">Dấu tích xưa, lòng biết ơn hôm nay</text><circle cx="110" cy="202" r="30" fill="#0369a1"/><text x="100" y="214" font-size="32" fill="white">1</text><text x="160" y="198" font-size="27" fill="#334155">Thành Điện Hải – di tích lịch sử</text><text x="160" y="233" font-size="18" fill="#334155">Thành Điện Hải là Di tích quốc gia đặc biệt.</text><circle cx="110" cy="307" r="30" fill="#0369a1"/><text x="100" y="319" font-size="32" fill="white">2</text><text x="160" y="303" font-size="27" fill="#334155">Cửa thành, tường thành và hào</text><text x="160" y="338" font-size="18" fill="#334155">Cửa thành, tường thành và hào là những dấu tích của ngôi</text><text x="160" y="368" font-size="18" fill="#334155">thành.</text><circle cx="110" cy="412" r="30" fill="#0369a1"/><text x="100" y="424" font-size="32" fill="white">3</text><text x="160" y="408" font-size="27" fill="#334155">Súng thần công và câu chuyện giữ thành</text><text x="160" y="443" font-size="18" fill="#334155">Súng thần công gợi nhớ câu chuyện chiến đấu bảo vệ quê hương.</text><circle cx="110" cy="517" r="30" fill="#0369a1"/><text x="100" y="529" font-size="32" fill="white">4</text><text x="160" y="513" font-size="27" fill="#334155">Nhớ người có công</text><text x="160" y="548" font-size="18" fill="#334155">Thành Điện Hải gắn với danh tướng Nguyễn Tri Phương.</text><text x="70" y="660" font-size="19" fill="#64748b">CHẠM ĐÀ NẴNG · Sơ đồ minh họa, không phải ảnh tư liệu</text></g></svg>