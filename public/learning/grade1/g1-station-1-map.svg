<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Nơi em ở, ngôi trường em yêu</title><rect width="960" height="720" fill="#fff7ed"/><g font-family="Arial, sans-serif"><rect x="32" y="32" width="896" height="656" rx="35" fill="white"/><rect x="55" y="55" width="850" height="90" rx="24" fill="#ea580c"/><text x="85" y="109" font-size="30" fill="white">Nơi em ở, ngôi trường em yêu</text><circle cx="110" cy="202" r="30" fill="#ea580c"/><text x="100" y="214" font-size="32" fill="white">1</text><text x="160" y="198" font-size="27" fill="#334155">Nơi em ở</text><text x="160" y="233" font-size="18" fill="#334155">Em biết tên khu vực nơi mình ở.</text><circle cx="110" cy="307" r="30" fill="#ea580c"/><text x="100" y="319" font-size="32" fill="white">2</text><text x="160" y="303" font-size="27" fill="#334155">Ngôi trường của em</text><text x="160" y="338" font-size="18" fill="#334155">Em biết tên trường và khu vực có trường mình.</text><circle cx="110" cy="412" r="30" fill="#ea580c"/><text x="100" y="424" font-size="32" fill="white">3</text><text x="160" y="408" font-size="27" fill="#334155">Từ nhà đến trường</text><text x="160" y="443" font-size="18" fill="#334155">Mỗi bạn có những địa điểm quen thuộc trên đường đến trường.</text><circle cx="110" cy="517" r="30" fill="#ea580c"/><text x="100" y="529" font-size="32" fill="white">4</text><text x="160" y="513" font-size="27" fill="#334155">Cùng yêu nơi mình sống</text><text x="160" y="548" font-size="18" fill="#334155">Em thể hiện tình yêu quê hương bằng việc làm vừa sức.</text><text x="70" y="660" font-size="19" fill="#64748b">CHẠM ĐÀ NẴNG · Sơ đồ minh họa, không phải ảnh tư liệu</text></g></svg>