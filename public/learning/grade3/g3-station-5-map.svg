<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Từ nan tre đến chiếc thúng đi biển</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#047857"/><text x="75" y="92" font-size="28" fill="white">Từ nan tre đến chiếc thúng đi biển</text><circle cx="90" cy="200" r="24" fill="#047857"/><text x="82" y="209" font-size="24" fill="white">1</text><text x="135" y="200" font-size="24" fill="#334155">Thuyền thúng – phương tiện sông biển</text><text x="135" y="232" font-size="17" fill="#334155">Thuyền thúng là phương tiện dạng tròn gắn với đời sống sông biển.</text><circle cx="90" cy="305" r="24" fill="#047857"/><text x="82" y="314" font-size="24" fill="white">2</text><text x="135" y="305" font-size="24" fill="#334155">Vật liệu và bàn tay người thợ</text><text x="135" y="337" font-size="17" fill="#334155">Nan tre tạo thân thúng; khâu xử lí chống thấm giúp thúng dùng trên nước.</text><circle cx="90" cy="410" r="24" fill="#047857"/><text x="82" y="419" font-size="24" fill="white">3</text><text x="135" y="410" font-size="24" fill="#334155">Các bước khái quát</text><text x="135" y="442" font-size="17" fill="#334155">Nghề làm thúng cần nhiều bước, kĩ năng và sự cẩn thận.</text><circle cx="90" cy="515" r="24" fill="#047857"/><text x="82" y="524" font-size="24" fill="white">4</text><text x="135" y="515" font-size="24" fill="#334155">Giữ nghề, giữ an toàn</text><text x="135" y="547" font-size="17" fill="#334155">Trân trọng người thợ và quan sát an toàn; không tự xuống thúng hay xuống</text><text x="135" y="574" font-size="17" fill="#334155">nước.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>