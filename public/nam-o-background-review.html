<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyệt nền Nam Ô – bảng chữ nhỏ</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#e8edf4;color:#173047}button{font:inherit;min-height:44px;padding:9px 14px;border:1px solid #9bb2c8;border-radius:10px;background:white;cursor:pointer}button[aria-pressed=true]{background:#174c70;color:white;border-color:#174c70}header{padding:14px 18px;background:#fff;position:relative}h1{font-size:20px;margin:0 0 6px}p{font-size:14px;line-height:1.5;margin:5px 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.viewport-wrap{padding:16px;overflow:auto}iframe{display:block;border:0;border-radius:14px;box-shadow:0 8px 28px #18374c33;background:#102c43}a{color:#145d89}.scene{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#73b9db 0%,#2a7f99 55%,#12344f 100%)}.scene.victory{background:linear-gradient(#d2a3bd 0%,#aa765d 52%,#192b48 100%)}.art{display:block;position:absolute;left:50%;top:0;transform:translateX(-50%);width:100vw;height:auto;max-width:none}.safe{position:absolute;pointer-events:none;left:50%;width:50vw;transform:translateX(-50%);top:0;height:100%;border-left:2px dashed #12f7dc;border-right:2px dashed #12f7dc;display:none}.scene.guides .safe{display:block}
/* Natural aspect ratio always: mobile crops peripheral scenery only, at most to the middle 50% of the source. */
@media(max-width:650px) and (orientation:portrait){.art{width:min(97.7777778dvh,200vw)}.safe{width:min(48.8888889dvh,100vw)}}
body.scene-only{overflow:hidden}.scene-only header,.scene-only .viewport-wrap{display:none}
</style></head><body><header><h1>Nam Ô · Bản duyệt bảng chữ nhỏ</h1><p>Ảnh gốc đã sửa bố cục, xuất WebP 1600 × 900. Bản đang dùng trong trò chơi vẫn giữ nguyên.</p><p>Điện thoại giữ tỷ lệ ảnh và cắt phần cảnh ở hai rìa; bảng chữ và rương năm giọt vàng ở vùng trung tâm. Không kéo giãn ảnh hoặc chữ.</p><nav id="states"><button data-state="play" aria-pressed="true">Ảnh chơi</button><button data-state="victory" aria-pressed="false">Ảnh chiến thắng</button></nav><nav id="sizes"><button data-size="390,844" aria-pressed="true">390 × 844</button><button data-size="375,667" aria-pressed="false">375 × 667</button><button data-size="320,640" aria-pressed="false">320 × 640</button><button data-size="1366,768" aria-pressed="false">1366 × 768</button><button id="guide" aria-pressed="false">Hiện vùng an toàn 50%</button></nav><p><a href="/games/shared/v1/grade3/review/nam-o-play-safe-v3.webp" target="_blank">Mở WebP ảnh chơi</a> · <a href="/games/shared/v1/grade3/review/nam-o-victory-safe-v3.webp" target="_blank">Mở WebP ảnh chiến thắng</a></p></header><div class="viewport-wrap"><iframe id="preview" title="Xem trước nền Nam Ô" width="390" height="844"></iframe></div><script>
const params=new URLSearchParams(location.search);const scenes={play:{src:'/games/shared/v1/grade3/review/nam-o-play-safe-v3.webp',alt:'Thử thách: Truy tìm bí quyết Nam Ô',board:[.27,0,.73,.34]},victory:{src:'/games/shared/v1/grade3/review/nam-o-victory-safe-v3.webp',alt:'CHÚC MỪNG · HOÀN THÀNH THỬ THÁCH · TRUY TÌM BÍ QUYẾT NAM Ô',board:[.25,0,.75,.34],chest:[.33,.64,.67,.999]}};
if(params.has('scene')){const kind=params.get('scene')==='victory'?'victory':'play',data=scenes[kind];document.body.className='scene-only';const scene=document.createElement('main');scene.className='scene '+kind+(params.get('guides')==='1'?' guides':'');scene.dataset.board=JSON.stringify(data.board);if(data.chest)scene.dataset.chest=JSON.stringify(data.chest);const img=document.createElement('img');img.className='art';img.src=data.src;img.alt=data.alt;img.width=1600;img.height=900;const safe=document.createElement('div');safe.className='safe';scene.append(img,safe);document.body.append(scene);}
else{let kind='play',guides=false;const f=document.querySelector('#preview');const render=()=>{f.src='/nam-o-background-review.html?scene='+kind+(guides?'&guides=1':'');};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{kind=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');f.width=w;f.height=h;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.querySelector('#guide').onclick=()=>{guides=!guides;document.querySelector('#guide').setAttribute('aria-pressed',String(guides));render();};render();}
</script></body></html>
