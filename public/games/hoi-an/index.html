 {id:'q1',kind:'imagepick',label:'NHIỆM VỤ 1 · NHẬN DIỆN',title:'Đâu là Chùa Cầu — biểu tượng của phố cổ Hội An?',desc:'Quan sát các dấu ấn nổi bật của Hội An, rồi tìm đúng Chùa Cầu.',choices:[['chuacau.jpg','Ảnh Chùa Cầu'],['nha-co.webp','Ảnh nhà cổ Phùng Hưng'],['hoiquan.jpeg','Ảnh Hội quán Phúc Kiến'],['song-hoai.jpeg','Ảnh bến sông Hoài']],answer:0,hint:'Gợi ý: So sánh cây cầu mái che với những ngôi nhà, hội quán và bến thuyền.'},

const current=()=>mode==='review'?qs[wrong[reviewAt]]:qs[idx];
function shuffle(values){for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}return values}
function scene(){let effects=qs.map((q,i)=>solved[i]?`solved-${q.id}`:'').filter(Boolean).join(' '),activeIndex=mode==='review'?wrong[reviewAt]:idx,doneCount=solved.filter(Boolean).length,progress=Math.round(doneCount/(qs.length-1)*100);return `<div class="map artMap ${effects}" id="map"><img class="mapArt" src="./hoian-game-3d.webp" alt="Phố cổ Hội An phong cách trò chơi 3D, có Chùa Cầu, đèn lồng và thuyền trên sông"><div class="mapVignette"></div><svg class="routeTrail" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="trailGlow" d="M24 43 C31 39 42 38 53 39 S72 41 81 47 C78 58 54 69 37 76 C48 81 60 83 70 82"/><path class="trailBase" d="M24 43 C31 39 42 38 53 39 S72 41 81 47 C78 58 54 69 37 76 C48 81 60 83 70 82"/><path class="trailDone" pathLength="100" stroke-dasharray="${progress} 100" d="M24 43 C31 39 42 38 53 39 S72 41 81 47 C78 58 54 69 37 76 C48 81 60 83 70 82"/></svg>${qs.map((q,i)=>`<span class="mapPin ${solved[i]?'done':''} ${i===activeIndex&&!solved[i]?'active':''} pin${i+1}" title="${solved[i]?'Đã hoàn thành':i===activeIndex?'Đang thực hiện':'Dấu vết '+(i+1)}">${solved[i]?'✦':i+1}</span>`).join('')}<div class="mapLabel">🌙 PHỐ BÊN SÔNG HOÀI</div></div>`}
function layout(q){let n=mode==='review'?`TRUY LẠI DẤU VẾT ${Math.min(reviewAt+1,wrong.length)} / ${wrong.length}`:`NHIỆM VỤ ${idx+1} / 5`;let p=mode==='review'?Math.round(reviewAt/Math.max(wrong.length,1)*100):Math.round(idx/5*100);return `<div class="layout"><section class="leftcol"><div class="journeyTop"><span>ĐÊM HỘI AN · THẮP SÁNG THƯƠNG CẢNG</span><div class="lanterns">${qs.map((_,i)=>`<span class="lamp ${solved[i]?'lit':''}" id="lamp${i}">🏮</span>`).join('')}</div></div>${scene()}<div class="note">✨ Mỗi dấu vết đúng sẽ làm phố cổ đổi khác</div><div class="leftAtmosphere" aria-hidden="true"><svg viewBox="0 0 520 250" preserveAspectRatio="none"><defs><linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16cfc2" stop-opacity=".06"/><stop offset="1" stop-color="#08bdbd" stop-opacity=".3"/></linearGradient><linearGradient id="lampLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd66b" stop-opacity=".92"/><stop offset="1" stop-color="#ff7a32" stop-opacity=".42"/></linearGradient></defs><path d="M0 104 Q35 80 73 101 L104 78 135 100 170 88 203 110 240 82 278 104 313 77 351 102 385 85 422 105 456 76 493 98 520 86V180H0Z" fill="#061c35" opacity=".62"/><path d="M0 112 40 93 76 107 105 84 139 105 172 94 207 116 241 89 278 110 314 83 351 108 386 92 423 111 458 82 495 104 520 94" fill="none" stroke="#58d6d0" stroke-opacity=".23" stroke-width="2"/><path d="M0 153 Q86 129 174 153 T347 151 T520 148V250H0Z" fill="url(#river)"/><g fill="#ffd77a" opacity=".62"><rect x="55" y="111" width="6" height="10" rx="2"/><rect x="126" y="113" width="6" height="10" rx="2"/><rect x="300" y="116" width="6" height="10" rx="2"/><rect x="401" y="114" width="6" height="10" rx="2"/><rect x="475" y="108" width="6" height="10" rx="2"/></g><g class="lanternGlow"><path d="M90 35v17" stroke="#ffd66b" stroke-width="2"/><path d="M79 54 Q90 45 101 54 L98 72 Q90 78 82 72Z" fill="url(#lampLight)" stroke="#ffe49a" stroke-width="1.4"/><path d="M84 57h12M84 69h12" stroke="#9b4b3e" stroke-opacity=".7" stroke-width="1.2"/><path d="M385 47v15" stroke="#ffd66b" stroke-width="2"/><path d="M375 63 Q385 55 395 63 L392 79 Q385 85 378 79Z" fill="url(#lampLight)" stroke="#ffe49a" stroke-width="1.2"/><path d="M380 66h10M380 77h10" stroke="#9b4b3e" stroke-opacity=".7" stroke-width="1"/></g><g class="riverGlow" fill="none" stroke-linecap="round"><path d="M34 183q42-10 83 0t82 0" stroke="#40eddf" stroke-opacity=".52" stroke-width="2.5"/><path d="M258 205q56-12 112 0t112 0" stroke="#ffd26a" stroke-opacity=".52" stroke-width="3"/><path d="M112 228q34-8 68 0t68 0" stroke="#45cbe0" stroke-opacity=".4" stroke-width="2"/><path d="M366 173q34-7 68 0" stroke="#ffae52" stroke-opacity=".38" stroke-width="2"/></g><circle cx="208" cy="50" r="2.2" fill="#fff0a0" opacity=".8"/><circle cx="276" cy="68" r="1.7" fill="#7ef6e3" opacity=".8"/><circle cx="444" cy="38" r="2" fill="#fff0a0" opacity=".75"/></svg></div></section><section class="side"><div class="progress"><span>${n}</span><span>Thắp sáng phố cổ</span></div><div class="bar"><div class="barin" style="width:${p}%"></div></div><div class="card"><span class="eyebrow">${q.label}</span><h1>${q.title}</h1><p class="desc">${q.desc}</p>${renderTask(q)}<div class="feedback" id="feedback" aria-live="polite"></div>${q.kind==='match'?'<div class="actions"><button class="primary" id="confirm" disabled>XÁC NHẬN CÁC CẶP</button></div>':''}${q.kind==='search'?'<div class="actions"><button class="primary" id="confirm" disabled>XÁC NHẬN DẤU VẾT</button></div>':''}</div></section></div>`}
function renderTask(q){if(q.kind==='pick')return `<div class="opts">${choiceOrder.map(i=>{const c=q.choices[i];return `<button class="opt" data-i="${i}"><span class="ico">${c[0]}</span>${c[1]}</button>`}).join('')}</div>`;if(q.kind==='imagepick')return `<div class="imageChoices">${choiceOrder.map(i=>{const c=q.choices[i];return `<button class="imageOption" data-i="${i}" aria-label="${c[1]}"><img src="./${c[0]}" alt="${c[1]}"></button>`}).join('')}</div><div class="imageCredits">Ảnh tư liệu: Vinpearl · Đà Nẵng Best · Triple · Ftrip Vietnam</div>`;if(q.kind==='match')return `<div class="matching"><div class="matchcol"><div class="matchTitle">ĐỊA ĐIỂM</div>${q.left.map((x,i)=>`<button class="matchitem" data-side="left" data-i="${i}">${x}</button>`).join('')}</div><div class="matchcol"><div class="matchTitle">GỢI NHỚ</div>${rightOrder.map((sourceI,displayI)=>`<button class="matchitem" data-side="right" data-i="${displayI}">${q.right[sourceI]}</button>`).join('')}</div></div><div class="matchhelper" id="helper">Ghép đủ 4 cặp rồi xác nhận một lần.</div><div class="pairHints" id="pairHints"></div>`;return `<div class="searchScene">${spotOrder.map(i=>{const x=q.spots[i];return `<button class="spot" data-name="${x[1]}"><span>${x[0]}</span>${x[1]}</button>`}).join('')}</div>`}
function render(){if(mode==='ending'){ending();return}fireworksStopper?.();app.classList.remove('endingMode');let q=current();choiceOrder=q.choices?shuffle(q.choices.map((_,i)=>i)):[];rightOrder=q.kind==='match'?shuffle(q.right.map((_,i)=>i)):[];matchAnswer=q.kind==='match'?q.answer.map(originalI=>rightOrder.indexOf(originalI)):[];spotOrder=q.kind==='search'?shuffle(q.spots.map((_,i)=>i)):[];found=[];selected={side:null,index:null};if(q.kind==='match'){pairs=[null,null,null,null];pairResult=[null,null,null,null]}root.innerHTML=layout(q);if(q.kind==='pick')wirePick(q);if(q.kind==='imagepick')wireImagePick(q);if(q.kind==='match')wireMatch(q);if(q.kind==='search')wireSearch(q)}
function wirePick(q){let buttons=[...document.querySelectorAll('.opt')];buttons.forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;buttons.forEach(x=>x.classList.remove('selected','wrong','correct'));b.classList.add(i===q.answer?'correct':'wrong');grade(q,i===q.answer)})}
function wirePhoto(q){document.getElementById('photo').onclick=e=>{if(locked)return;let r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;grade(q,x>.04&&x<.96&&y>.25&&y<.53)}}
function wireImagePick(q){let buttons=[...document.querySelectorAll('.imageOption')];buttons.forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;buttons.forEach(x=>x.classList.remove('selected','wrong','correct'));b.classList.add(i===q.answer?'correct':'wrong');grade(q,i===q.answer)})}
function wireMatch(q){let items=[...document.querySelectorAll('.matchitem')],btn=document.getElementById('confirm'),helper=document.getElementById('helper'),hintBox=document.getElementById('pairHints');function paint(message){items.forEach(b=>{let side=b.dataset.side,i=+b.dataset.i,li=side==='left'?i:pairs.indexOf(i),state=li<0?null:pairResult[li],isSelected=selected.side===side&&selected.index===i,hasPair=li>=0&&(side==='left'?pairs[i]!==null:true);b.classList.remove('pair0','pair1','pair2','pair3');if(hasPair&&state===null)b.classList.add(`pair${li}`);b.classList.toggle('active',isSelected);b.classList.toggle('paired',hasPair);b.classList.toggle('correctPair',state==='correct');b.classList.toggle('wrongPair',state==='wrong')});btn.disabled=pairs.some(x=>x===null);btn.textContent=pairResult.some(x=>x!==null)?'XÁC NHẬN LẠI':'XÁC NHẬN CÁC CẶP';let done=pairs.filter(x=>x!==null).length;helper.textContent=message||(selected.side?`Đã chọn “${selected.side==='left'?q.left[selected.index]:q.right[rightOrder[selected.index]]}”. Chạm vào một ô màu khác ở cột bên kia để nối.`:done===4?'Đủ 4 cặp rồi. Mỗi màu đang đánh dấu một cặp — hãy xác nhận để kiểm tra.':`Đã nối ${done}/4 cặp. Chạm một địa điểm rồi chạm một gợi nhớ.`);hintBox.innerHTML=pairResult.map((state,i)=>state==='wrong'?`<div class="pairHint"><b>✕ ${q.left[i]} ↔ ${q.right[rightOrder[pairs[i]]]}</b><span>Gợi ý: ${q.pairHints[i]}</span></div>`:'').join('')}
items.forEach(b=>b.onclick=()=>{if(locked)return;let side=b.dataset.side,i=+b.dataset.i,li=side==='left'?i:pairs.indexOf(i);if(li>=0&&pairResult[li]==='correct'){selected={side:null,index:null};helper.textContent='Cặp này đã đúng ✓. Em có thể sửa các cặp màu đỏ.';return}if(!selected.side){selected={side,index:i};beep(440);paint();return}if(selected.side===side){selected={side,index:i};beep(440);paint();return}let newLi=side==='left'?i:selected.index,ri=side==='right'?i:selected.index,old=pairs.indexOf(ri);if(pairResult[newLi]==='correct'||(old!==-1&&pairResult[old]==='correct')){selected={side:null,index:null};paint('Cặp có dấu tích đã khóa để không bị đổi nhầm. Hãy sửa cặp đỏ.');return}if(old!==-1&&old!==newLi){let displaced=pairs[newLi];pairs[old]=displaced;pairResult[old]=null}pairs[newLi]=ri;pairResult[newLi]=null;selected={side:null,index:null};beep(600);paint()});btn.onclick=()=>{if(locked)return;pairResult=pairs.map((v,i)=>v===matchAnswer[i]?'correct':'wrong');paint('Đã kiểm tra tất cả cặp: xanh có dấu tích, đỏ có gợi ý.');if(pairResult.every(x=>x==='correct')){btn.disabled=true;grade(q,true)}else grade(q,false)};paint()}
function wireSearch(q){let btn=document.getElementById('confirm'),spots=[...document.querySelectorAll('.spot')];spots.forEach(b=>b.onclick=()=>{if(locked)return;spots.forEach(x=>x.classList.remove('wrong'));let name=b.dataset.name;if(found.includes(name)){found=found.filter(x=>x!==name);b.classList.remove('found')}else{if(found.length>=2)return;found.push(name);b.classList.add('found')}beep(500);btn.disabled=found.length!==2;document.getElementById('feedback').textContent=found.length===2?'Đã chọn đủ hai chi tiết. Em có thể đổi lựa chọn trước khi xác nhận.':'Hãy tìm hai chi tiết rồi xác nhận.';document.getElementById('feedback').className='feedback'});btn.onclick=()=>{if(locked)return;grade(q,found.includes('Mái ngói')&&found.includes('Đèn lồng'))}}
function playAnswerFeedback(ok){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C();ctx.resume?.();const now=ctx.currentTime;if(ok){[[659.25,0],[880,.14],[1046.5,.28],[1318.5,.42]].forEach(([freq,delay])=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),start=now+delay;osc.type='triangle';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.26,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+.43);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.33)});const sparkle=ctx.createOscillator(),sg=ctx.createGain();sparkle.type='sine';sparkle.frequency.setValueAtTime(1760,now+.05);sparkle.frequency.exponentialRampToValueAtTime(2640,now+.48);sg.gain.setValueAtTime(.0001,now+.05);sg.gain.exponentialRampToValueAtTime(.11,now+.08);sg.gain.exponentialRampToValueAtTime(.0001,now+.62);sparkle.connect(sg);sg.connect(ctx.destination);sparkle.start(now+.05);sparkle.stop(now+.65)}else{[440,330].forEach((freq,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),start=now+i*.18;osc.type='triangle';osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(freq*.72,start+.28);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.32,start+.03);gain.gain.exponentialRampToValueAtTime(.0001,start+.42);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.45)})}setTimeout(()=>ctx.close(),1450)}catch(e){}}
function grade(q,ok){if(locked)return;let f=document.getElementById('feedback'),qi=qs.indexOf(q);if(ok){locked=true;solved[qi]=true;if(solved.every(Boolean))playVictorySound();else playAnswerFeedback(true);f.textContent=mode==='review'?'Dấu vết đã được khôi phục!':'Chính xác! Phố cổ vừa đổi khác.';f.className='feedback ok';document.getElementById('map')?.classList.add(`solved-${q.id}`,'glow');let lamp=document.getElementById('lamp'+qi);lamp?.classList.add('lit');setTimeout(()=>{if(mode==='review'){wrong=wrong.filter(i=>i!==qi);if(reviewAt>=wrong.length)mode='ending'}else{idx++;if(idx>=qs.length)mode='ending'}locked=false;render()},1150)}else{playAnswerFeedback(false);f.textContent=`Chưa khớp. ${q.hint}`;f.className='feedback bad';if(q.kind==='match'&&mode==='first')f.textContent='Dấu vết chưa khớp. Em sẽ truy lại sau khi hoàn thành các câu.';if(mode==='first'&&!wrong.includes(qi))wrong.push(qi);if(q.kind==='search')found.forEach(name=>document.querySelector(`.spot[data-name="${name}"]`)?.classList.add('wrong'));locked=true;setTimeout(()=>{if(mode==='first'&&(q.kind==='pick'||q.kind==='imagepick'||q.kind==='match'||q.kind==='search')){idx++;if(idx>=qs.length)mode='ending';locked=false;render()}else locked=false},2000);document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'))}}
function ending(){app.classList.add('endingMode');const score=solved.filter(Boolean).length,pending=wrong.filter(i=>!solved[i]);root.innerHTML=`<section class="ending"><div class="emblem">🏮</div><span class="eyebrow">CHẶNG 2 · CHINH PHỤC THỬ THÁCH</span><h1>Hoàn thành thử thách!</h1><div class="resultScore">${score}<span>/5 dấu ấn sáng lên</span></div><p>${pending.length?`Còn ${pending.length} câu cần tìm lại dấu vết.`:'Phố cổ Hội An đã sáng đèn cùng em!'}</p><div class="shards">${qs.map((_,i)=>`<span class="shard ${solved[i]?'good':''}">${solved[i]?'✦':'?'}</span>`).join('')}</div>${pending.length?`<button class="primary" id="retry">TRUY LẠI DẤU VẾT</button>`:`<button class="primary" id="replay">CHƠI LẠI THỬ THÁCH</button>`}</section>`;if(!pending.length){fireworks();playVictorySound();if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-complete',stationId:'g2-station-4'},window.location.origin)}document.getElementById('retry')?.addEventListener('click',()=>{mode='review';reviewAt=0;render()});document.getElementById('replay')?.addEventListener('click',()=>{victoryAudio?.pause();if(victoryAudio)victoryAudio.currentTime=0;victoryAudioStarted=false;fireworksStopper?.();idx=0;mode='first';wrong=[];reviewAt=0;solved=Array(qs.length).fill(false);locked=false;app.classList.remove('endingMode');render()})}
function playVictorySound(){if(!soundOn||victoryAudioStarted)return;try{victoryAudioStarted=true;victoryAudio=new Audio('./victory-hoian.mp3');victoryAudio.preload='auto';victoryAudio.volume=1;victoryAudio.currentTime=0;victoryAudio.play().catch(()=>{playAnswerFeedback(true)})}catch(e){playAnswerFeedback(true)}}
function fireworks(){fireworksStopper?.();const canvas=document.createElement('canvas');canvas.id='fireworks';app.appendChild(canvas);const ctx=canvas.getContext('2d');if(!ctx)return;let burstTimer;const stop=()=>{clearInterval(burstTimer);canvas.remove();if(fireworksStopper===stop)fireworksStopper=null};fireworksStopper=stop;let w=0,h=0,dpr=1;function resize(){const r=app.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();const colors=['#ffe36e','#ff5c90','#64e7ff','#c29aff','#fff8df','#ff9a42'];let particles=[];function explode(){if(!canvas.isConnected)return;const x=60+Math.random()*Math.max(w-120,40),y=65+Math.random()*Math.max(h*.52,100),count=82+Math.floor(Math.random()*36);for(let i=0;i<count;i++){const a=Math.PI*2*i/count,s=1.2+Math.random()*4.4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:48+Math.random()*22,max:70,r:1.2+Math.random()*2.4,color:colors[Math.floor(Math.random()*colors.length)]})}}explode();burstTimer=setInterval(explode,480);function draw(){if(!canvas.isConnected)return;ctx.clearRect(0,0,w,h);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.vy*=.992;p.life--;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=13;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;ctx.shadowBlur=0;if(canvas.isConnected)requestAnimationFrame(draw)}requestAnimationFrame(draw)}
render();
})();
</script>
