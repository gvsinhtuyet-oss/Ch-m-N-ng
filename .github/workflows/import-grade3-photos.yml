name: Import reviewed Grade 3 photographs
on:
  push:
    branches: [main]
    paths: [content-review/grade3-media-sources.json, scripts/import-grade3-photos.py, .github/workflows/import-grade3-photos.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grade3-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Use committed reviewed photos or import missing set
        run: |
          if [ ! -f content-review/grade3-media-integrity.json ]; then
            python scripts/import-grade3-photos.py
          else
            python scripts/import-grade3-photos.py my-khe
          fi
      - name: Prepare temporary local visual review transport
        run: |
          python - <<'PYTHON'
          import base64
          from pathlib import Path
          target=Path('content-review/grade3-transfer')
          target.mkdir(exist_ok=True)
          for photo in Path('public/learning/grade3/photos').glob('*.webp'):
              (target/(photo.stem+'.txt')).write_text(base64.b64encode(photo.read_bytes()).decode())
          PYTHON
      - name: Commit reviewed photographs only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/learning/grade3/photos content-review/grade3-media-integrity.json content-review/grade3-transfer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package openly licensed Grade 3 photographs locally"
          git pull --rebase origin main
          git push origin HEAD:main
