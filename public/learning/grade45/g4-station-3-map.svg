<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Một sản phẩm, nhiều bàn tay</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#0369a1"/><text x="70" y="86" font-size="28" fill="white">Một sản phẩm, nhiều bàn tay</text><circle cx="90" cy="210" r="25" fill="#0369a1"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Kinh tế quanh em</text><text x="140" y="244" font-size="16" fill="#334155">Kinh tế gắn với sản xuất, trao đổi và các dịch vụ trong đời sống.</text><circle cx="90" cy="315" r="25" fill="#0369a1"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Tạo ra sản phẩm</text><text x="140" y="349" font-size="16" fill="#334155">Nhiều người và nhiều khâu cùng góp phần tạo ra sản phẩm.</text><circle cx="90" cy="420" r="25" fill="#0369a1"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Dịch vụ kết nối cuộc sống</text><text x="140" y="454" font-size="16" fill="#334155">Dịch vụ hỗ trợ nhu cầu và kết nối các hoạt động kinh tế.</text><circle cx="90" cy="525" r="25" fill="#0369a1"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Sáng tạo và trách nhiệm</text><text x="140" y="559" font-size="16" fill="#334155">Làm việc tốt cần hợp tác, sáng tạo và trách nhiệm.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>