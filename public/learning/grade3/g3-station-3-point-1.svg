<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Các cộng đồng cùng chung sống</title><rect width="960" height="720" rx="30" fill="#ecfdf5"/><g font-family="Arial,sans-serif"><text x="60" y="85" font-size="21" fill="#047857">CHẠM ĐÀ NẴNG · KHỐI 3 · ĐIỂM 1</text><text x="60" y="180" font-size="30" fill="#064e3b">Các cộng đồng cùng chung sống</text><text x="80" y="300" font-size="29" fill="#12354b">Kinh, Cơ Tu, Co, Giẻ Triêng, Xơ Đăng và Hoa là</text><text x="80" y="352" font-size="29" fill="#12354b">những cộng đồng dân tộc được giới thiệu trong</text><text x="80" y="404" font-size="29" fill="#12354b">bài.</text><text x="60" y="670" font-size="18" fill="#475569">Sơ đồ học tập theo tài liệu lớp 3; không phải ảnh tư liệu.</text></g></svg>