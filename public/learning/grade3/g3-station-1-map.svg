<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Hai cảnh biển, một tình yêu quê hương</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#0369a1"/><text x="75" y="92" font-size="28" fill="white">Hai cảnh biển, một tình yêu quê hương</text><circle cx="90" cy="200" r="24" fill="#0369a1"/><text x="82" y="209" font-size="24" fill="white">1</text><text x="135" y="200" font-size="24" fill="#334155">Mỹ Khê – bờ cát và nhịp sóng</text><text x="135" y="232" font-size="17" fill="#334155">Mỹ Khê nổi bật với bãi cát và không gian biển.</text><circle cx="90" cy="305" r="24" fill="#0369a1"/><text x="82" y="314" font-size="24" fill="white">2</text><text x="135" y="305" font-size="24" fill="#334155">Bàn Than – ghềnh đá ven biển</text><text x="135" y="337" font-size="17" fill="#334155">Cảnh Bàn Than có ghềnh đá ven biển; khác với nét nổi bật của bờ cát Mỹ</text><text x="135" y="364" font-size="17" fill="#334155">Khê.</text><circle cx="90" cy="410" r="24" fill="#0369a1"/><text x="82" y="419" font-size="24" fill="white">3</text><text x="135" y="410" font-size="24" fill="#334155">Biển gắn với cuộc sống</text><text x="135" y="442" font-size="17" fill="#334155">Biển có giá trị với đời sống, nghề nghiệp và du lịch.</text><circle cx="90" cy="515" r="24" fill="#0369a1"/><text x="82" y="524" font-size="24" fill="white">4</text><text x="135" y="515" font-size="24" fill="#334155">An toàn và giữ biển sạch</text><text x="135" y="547" font-size="17" fill="#334155">Tuân thủ hướng dẫn, tránh vùng cấm và bỏ rác đúng nơi.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>