<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Nhớ người đi trước, quý cuộc sống hòa bình</title><rect width="960" height="720" rx="30" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="24" y="24" width="912" height="672" rx="26" fill="white"/><rect x="40" y="40" width="880" height="108" rx="20" fill="#047857"/><text x="66" y="88" font-size="27" fill="white">Nhớ người đi trước, quý cuộc sống hòa bình</text><text x="66" y="182" font-size="19" fill="#047857">Hành trình khối 5</text><rect x="54" y="208" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="238" r="20" fill="#047857"/><text x="79" y="245" font-size="21" fill="white">1</text><text x="123" y="239" font-size="22" fill="#334155">Mẹ Nhu – người mẹ chở che</text><text x="123" y="269" font-size="16" fill="#334155">Nuôi giấu, bảo vệ chiến sĩ biệt động.</text><rect x="54" y="311" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="341" r="20" fill="#047857"/><text x="79" y="348" font-size="21" fill="white">2</text><text x="123" y="342" font-size="22" fill="#334155">Sự kiện Thanh Khê năm 1968</text><text x="123" y="372" font-size="16" fill="#334155">Ngày 26 tháng 12 năm 1968.</text><rect x="54" y="414" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="444" r="20" fill="#047857"/><text x="79" y="451" font-size="21" fill="white">3</text><text x="123" y="445" font-size="22" fill="#334155">Mẹ Nguyễn Thị Thứ</text><text x="123" y="475" font-size="16" fill="#334155">Hai người khác nhau, có cuộc đời và tư liệu riêng.</text><rect x="54" y="517" width="852" height="93" rx="15" fill="#f0fdf4"/><circle cx="85" cy="547" r="20" fill="#047857"/><text x="79" y="554" font-size="21" fill="white">4</text><text x="123" y="548" font-size="22" fill="#334155">Tri ân bằng hiểu biết và việc làm</text><text x="123" y="578" font-size="16" fill="#334155">Tượng Mẹ Nguyễn Thị Thứ chụp ở Hà Nội năm 2011.</text><text x="55" y="674" font-size="17" fill="#475569">Sơ đồ học tập · Không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>