<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Giữ rừng để giữ cây quý</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#047857"/><text x="70" y="86" font-size="28" fill="white">Giữ rừng để giữ cây quý</text><circle cx="90" cy="210" r="25" fill="#047857"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Gặp cây sâm Ngọc Linh</text><text x="140" y="244" font-size="16" fill="#334155">Ảnh có nguồn giúp tìm hiểu cây, không thay cho xác định chuyên môn.</text><circle cx="90" cy="315" r="25" fill="#047857"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Cây quý dưới tán rừng</text><text x="140" y="349" font-size="16" fill="#334155">Bảo tồn cây gắn với môi trường rừng và điều kiện sinh thái phù hợp.</text><circle cx="90" cy="420" r="25" fill="#047857"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Giá trị và công sức gìn giữ</text><text x="140" y="454" font-size="16" fill="#334155">Giữ cây quý là giữ nguồn gen, sinh thái và công sức người lao động.</text><circle cx="90" cy="525" r="25" fill="#047857"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Người tìm hiểu có trách nhiệm</text><text x="140" y="559" font-size="16" fill="#334155">Tìm hiểu cây quý bằng nguồn đáng tin và không làm hại cây, rừng.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>