<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="48" fill="#fff8e7"/><rect x="28" y="28" width="1544" height="944" rx="36" fill="none" stroke="#d97706" stroke-width="4"/><g font-family="Arial, sans-serif" text-anchor="middle"><text x="800" y="100" font-size="32" fill="#b45309" font-weight="bold">CHẠM ĐÀ NẴNG · KHỐI 2</text><text x="800" y="158" font-size="34" fill="#0f172a" font-weight="bold">Cù Lao Chàm – Khu bảo tồn thiên nhiên Sơn Trà</text><polyline points="300,330 800,330 1300,330 1300,670 800,670" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linejoin="round" stroke-dasharray="16 12"/><circle cx="300" cy="330" r="64" fill="#0f766e" stroke="white" stroke-width="8"/><text x="300" y="347" font-size="48" fill="white" font-weight="bold">1</text><text x="300" y="436" font-size="24" fill="#1e293b" font-weight="bold">Cù Lao Chàm – Hòn Lao là đảo</text><text x="300" y="466" font-size="24" fill="#1e293b" font-weight="bold">chính</text><circle cx="800" cy="330" r="64" fill="#0f766e" stroke="white" stroke-width="8"/><text x="800" y="347" font-size="48" fill="white" font-weight="bold">2</text><text x="800" y="436" font-size="24" fill="#1e293b" font-weight="bold">Những nét đặc sắc của Cù Lao</text><text x="800" y="466" font-size="24" fill="#1e293b" font-weight="bold">Chàm</text><circle cx="1300" cy="330" r="64" fill="#0f766e" stroke="white" stroke-width="8"/><text x="1300" y="347" font-size="48" fill="white" font-weight="bold">3</text><text x="1300" y="436" font-size="24" fill="#1e293b" font-weight="bold">Hoạt động khi tham quan Cù</text><text x="1300" y="466" font-size="24" fill="#1e293b" font-weight="bold">Lao Chàm</text><circle cx="1300" cy="670" r="64" fill="#0f766e" stroke="white" stroke-width="8"/><text x="1300" y="687" font-size="48" fill="white" font-weight="bold">4</text><text x="1300" y="776" font-size="24" fill="#1e293b" font-weight="bold">Sinh vật ở Khu bảo tồn thiên</text><text x="1300" y="806" font-size="24" fill="#1e293b" font-weight="bold">nhiên Sơn Trà</text><circle cx="800" cy="670" r="64" fill="#0f766e" stroke="white" stroke-width="8"/><text x="800" y="687" font-size="48" fill="white" font-weight="bold">5</text><text x="800" y="776" font-size="24" fill="#1e293b" font-weight="bold">Em bảo vệ Cù Lao Chàm và Sơn</text><text x="800" y="806" font-size="24" fill="#1e293b" font-weight="bold">Trà</text><text x="800" y="925" font-size="23" fill="#64748b">Sơ đồ hành trình học tập · Không phải bản đồ địa lý</text></g></svg>