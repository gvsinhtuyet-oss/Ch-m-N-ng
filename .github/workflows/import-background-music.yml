name: Import local background music

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-background-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source music from Google Drive
        run: |
          set -euo pipefail
          mkdir -p public/audio
          python -m pip install --quiet gdown
          gdown "10gje9w4Mjz2wNRXFG8iDt2UcZ6eVxwT0" -O /tmp/cham-danang-source.mp3
          test -s /tmp/cham-danang-source.mp3
          file /tmp/cham-danang-source.mp3

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create compact local MP3
        run: |
          set -euo pipefail
          ffmpeg -y -i /tmp/cham-danang-source.mp3 \
            -vn -codec:a libmp3lame -b:a 32k -ar 44100 -ac 1 \
            public/audio/cham-danang-background.mp3
          test "$(stat -c%s public/audio/cham-danang-background.mp3)" -gt 100000
          ffprobe -v error -show_entries format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 public/audio/cham-danang-background.mp3

      - name: Commit music into the repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/cham-danang-background.mp3
          if git diff --cached --quiet; then
            echo "Background music is already up to date."
            exit 0
          fi
          git commit -m "Add compressed local background music"
          git push origin HEAD:main
