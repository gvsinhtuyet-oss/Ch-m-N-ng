<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử React khối 3</title><style>body{margin:0;background:#dce5ec;font:16px system-ui}nav{display:flex;gap:6px;padding:6px;flex-wrap:wrap}button{padding:8px}iframe{border:0;display:block;background:white}</style><nav id="stations"></nav><nav id="sizes"></nav><iframe title="Bản thử khối 3" id="game" src="/?stage2-preview=g3-station-3" width="1366" height="768"></iframe><script>for(const n of [2,3,4,5]){const b=document.createElement('button');b.textContent=`Trạm ${n}`;b.onclick=()=>{game.src=`/?stage2-preview=g3-station-${n}`};document.querySelector('#stations').append(b)}for(const [w,h]of [[1366,768],[1024,768],[390,844],[375,667],[320,640],[844,390],[667,375],[640,320]]){const b=document.createElement('button');b.textContent=`${w} × ${h}`;b.onclick=()=>{game.width=w;game.height=h};document.querySelector('#sizes').append(b)}</script></html>
