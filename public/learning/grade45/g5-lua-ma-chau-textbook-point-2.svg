<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650"><title>Trồng dâu và nuôi tằm</title><rect width="960" height="650" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="610" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Trồng dâu và nuôi tằm</text><text x="75" y="235" font-size="48" fill="#047857">2</text><text x="75" y="325" font-size="28" fill="#334155">Tằm ăn lá dâu, lớn lên rồi nhả tơ tạo kén; nuôi</text><text x="75" y="363" font-size="28" fill="#334155">tằm là một công đoạn của nghề lụa.</text><text x="75" y="535" font-size="24" fill="#334155">Quan sát → Tìm căn cứ → Chia sẻ</text><text x="55" y="610" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>