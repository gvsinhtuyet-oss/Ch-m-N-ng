<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Thuyền thúng – phương tiện sông biển</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#047857"/><text x="75" y="92" font-size="28" fill="white">Thuyền thúng – phương tiện sông biển</text><ellipse cx="480" cy="390" rx="260" ry="70" fill="#fef3c7" stroke="#a16207" stroke-width="13"/><path d="M220 390q15 190 260 190t260-190" fill="#d6b57f" stroke="#a16207" stroke-width="10"/><path d="M300 430l60 115m40-100l40 120m70-120l-10 120m110-140l-40 120m-280-90h360m-320 50h280" stroke="#a16207" stroke-width="6"/><path d="M740 300l-90 230" stroke="#166534" stroke-width="13"/><text x="75" y="625" font-size="20" fill="#334155">Thuyền thúng là phương tiện dạng tròn gắn với đời sống sông biển.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>