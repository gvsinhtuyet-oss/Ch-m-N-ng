<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Tìm hiểu một số hoạt động kinh tế Đà Nẵng</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#0369a1"/><g font-family="Arial,sans-serif" fill="#0369a1"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Tìm hiểu một số hoạt động kinh tế Đà</text><text x="64" y="170" font-size="32" font-weight="bold">Nẵng</text><text x="64" y="255" font-size="24" fill="#334155">1. Công nghiệp làm ra sản phẩm</text><text x="64" y="297" font-size="24" fill="#334155">2. Dịch vụ và du lịch</text><text x="64" y="339" font-size="24" fill="#334155">3. Nông nghiệp và cách làm mới</text><text x="64" y="381" font-size="24" fill="#334155">4. Kinh tế biển và sự kết nối</text><text x="64" y="423" font-size="24" fill="#334155">5. Làng nghề và công việc của người thân</text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>