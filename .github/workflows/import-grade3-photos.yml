name: Import additional reviewed Grade 3 media
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-grade3-photos.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import-grade3-photos.py phan-chau-trinh tran-quy-cap tieng-dan-1937
      - name: Prepare temporary review transport
        run: |
          python - <<'PYTHON'
          import base64
          from pathlib import Path
          target=Path('content-review/grade3-transfer');target.mkdir(exist_ok=True)
          for name in ['phan-chau-trinh','tran-quy-cap','tieng-dan-1937']:
              (target/(name+'.txt')).write_text(base64.b64encode(Path('public/learning/grade3/photos/'+name+'.webp').read_bytes()).decode())
          PYTHON
      - name: Commit media only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/learning/grade3/photos content-review/grade3-media-integrity.json content-review/grade3-transfer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package additional reviewed Grade 3 archival media"
          git pull --rebase origin main
          git push origin HEAD:main
