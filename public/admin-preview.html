function renderPage(){let root=document.querySelector('#pageContent');switch(active){case 'stations':root.innerHTML=`<div class="panel bluepanel"><div class="panelbar"><div class="round">☁</div><div><h2>Thêm ảnh và học liệu</h2><small>Chỉnh ảnh bìa, bản đồ nhận quà và các điểm chạm theo từng trạm</small></div></div>${demoBadge}<div class="field" style="margin-bottom:17px"><label for="station">Chọn trạm</label><select id="station" onchange="showStation(this.value)"><option value="1">Khối 1 – Quê hương em</option><option value="2">Khối 2 – Di sản quê hương</option><option value="3">Khối 3 – Lễ hội truyền thống</option><option value="4">Khối 4 – Danh thắng Đà Nẵng</option><option value="5">Khối 5 – Khám phá địa phương</option></select></div><div class="cols2"><article class="imagecard"><h3>${icon('image')} Ảnh bìa trạm</h3><div class="upload"><input type="file" id="cover" accept="image/*" onchange="previewImage(this,'coverPreview')" aria-label="Chọn ảnh bìa để xem thử"></div><div class="path" id="coverPath">/learning/grade1/media/han-river-bridge.webp</div><img id="coverPreview" src="${bridgeSrc}" alt="Ảnh bìa cầu sông Hàn minh họa"><div class="status">✓ Ảnh minh họa · Có thể thay bằng ảnh bạn chọn</div></article><article class="imagecard"><h3>${icon('map')} Ảnh bản đồ nhận quà</h3><div class="upload"><input type="file" id="map" accept="image/*" onchange="previewImage(this,'mapPreview')" aria-label="Chọn bản đồ để xem thử"></div><div class="path" id="mapPath">/images/maps/g1-station-1.webp</div><img id="mapPreview" src="${mapSrc}" alt="Bản đồ nhận quà minh họa"><div class="status">✓ Bản đồ minh họa · Có thể thay bằng ảnh bạn chọn</div></article></div><div class="panelactions"><button class="btn subtle" onclick="toast('Bản demo không lưu; thao tác chỉ xem trước trên máy của bạn.')">Lưu bản xem thử</button><button class="btn" disabled title="Bản xem thử không thể xuất bản">🔒 Xuất bản cho học sinh</button><span class="pill orange">Đã khóa ghi dữ liệu</span></div></div>`;break;
case 'overview':root.innerHTML=`${demoBadge}<div class="kpis">${kpi('Giáo viên','28','Tài khoản quản lý')}${kpi('Lớp học','19','Khối 1–5','orange')}${kpi('Học sinh','736','Trong danh sách lớp','teal')}${kpi('Lượt triển khai','86','Theo nhật ký','violet')}</div><div class="cols2" style="margin-top:16px"><article class="panel"><div class="sectionhead"><h2>Hoạt động 6 tuần gần nhất</h2><span class="pill">Theo tuần</span></div>${chart([8,10,13,11,19,25],['T1','T2','T3','T4','T5','T6'])}<div class="legend"><span><i class="dot"></i>Tiết đã triển khai</span></div></article><article class="panel"><div class="sectionhead"><h2>Việc cần quan tâm</h2><span class="pill orange">Ưu tiên</span></div><div class="listitems"><article><div><strong>Góp ý học liệu chờ duyệt</strong><small>Xử lý thông tin giáo viên và học sinh</small></div><span class="pill orange">7</span></article><article><div><strong>Kế hoạch dạy học</strong><small>Kiểm tra nội dung tích hợp</small></div><span class="pill">12</span></article><article><div><strong>Báo cáo lớp học</strong><small>Đối chiếu dữ liệu minh chứng</small></div><span class="pill green">Sẵn sàng</span></article></div></article></div>`;break;

case 'ratings':root.innerHTML=`${demoBadge}<div class="cols2"><article class="panel"><div class="sectionhead"><h2>Đánh giá của người học</h2><span class="pill green">4,6/5 ★</span></div>${[38,16,3,1,0].map((v,i)=>`<div class="ratingrow"><span>${5-i} ★</span><div class="rail"><span style="width:${(v/58*100).toFixed(1)}%"></span></div><span>${v}</span></div>`).join('')}<p class="note">Ví dụ tổng cộng 58 đánh giá hợp lệ.</p></article><article class="panel"><div class="sectionhead"><h2>Góp ý chờ xử lý</h2><span class="pill orange">7 chờ duyệt</span></div><div class="listitems"><article><div><strong>Góp ý bổ sung nguồn hình ảnh</strong><small>Quê hương em · Khối 1</small></div><span class="pill orange">Chờ duyệt</span></article><article><div><strong>Điều chỉnh câu hỏi thực hành</strong><small>Di sản quê hương · Khối 2</small></div><span class="pill orange">Chờ duyệt</span></article></div></article></div>`;break;
case 'tracking':root.innerHTML=`${demoBadge}<article class="panel"><div class="sectionhead"><h2>Nhật ký triển khai</h2><span class="pill">12 dòng/trang</span></div><div class="toolbar">Khối: <select><option>Tất cả khối</option><option>Khối 1</option><option>Khối 2</option></select> <button class="btn subtle" onclick="toast('Bộ lọc đang dùng số liệu minh họa.')">Lọc</button></div><div class="listitems">${[['Khám phá quê hương em','Khối 1 · 06/11/2026'],['Tìm hiểu di sản Đà Nẵng','Khối 2 · 05/11/2026'],['Lễ hội truyền thống','Khối 3 · 04/11/2026']].map(x=>`<article><div><strong>${x[0]}</strong><small>${x[1]}</small></div><span class="pill green">Đã xác nhận</span></article>`).join('')}</div></article>`;break;
case 'classes':root.innerHTML=`${demoBadge}<div class="kpis">${kpi('Lớp có dữ liệu','19','Mẫu dữ liệu')}${kpi('Học sinh đã tham gia','628','Mẫu dữ liệu','orange')}${kpi('Học sinh hoàn thành','472','Mẫu dữ liệu','teal')}${kpi('Tỷ lệ tham gia','85%','Mẫu dữ liệu','violet')}</div><article class="panel" style="margin-top:16px"><h2>Tiến độ theo lớp</h2>${chart([19,24,20,28,22],['1/1','2/24','3/2','4/1','5/3'],'teal')}</article>`;break;
case 'gddp':root.innerHTML=`${demoBadge}<article class="panel"><div class="panelbar"><div class="round">⌖</div><div><h2>Địa chỉ Giáo dục địa phương</h2><small>Tìm kiếm theo khối, môn, bài và chủ đề</small></div></div><div class="cols3"><div class="field"><label>Khối lớp</label><select><option>Tất cả</option><option>Khối 1</option><option>Khối 2</option></select></div><div class="field"><label>Môn học</label><select><option>Tất cả</option><option>Tự nhiên và Xã hội</option><option>Tiếng Việt</option></select></div><div class="field"><label>Tên bài/chủ đề</label><input placeholder="Nhập từ khóa" oninput="document.getElementById('searchHint').textContent='Đang xem giao diện mẫu; chưa kết nối dữ liệu thật.'"></div></div><p id="searchHint" class="note">Bản xem thử chưa truy vấn dữ liệu GDĐP.</p><div class="listitems"><article><div><strong>Quê hương em</strong><small>Khối 1 · Tự nhiên và Xã hội</small></div><button class="btn subtle" onclick="toast('Mở bản thật sau khi bạn duyệt giao diện.')">Xem</button></article></div></article>`;break;
default:root.innerHTML=`${demoBadge}<article class="panel"><div class="panelbar"><div class="round">⚙</div><div><h2>${labels[active]}</h2><small>Khu vực quản trị — bố cục mẫu</small></div></div><div class="miniwarning">🔒 Chức năng cài đặt chỉ hoạt động với tài khoản Quản trị đã xác thực trên hệ thống thật. Bản xem thử không có quyền sửa hay lưu dữ liệu.</div><div class="panelactions"><button class="btn subtle" onclick="toast('Không có thay đổi nào được ghi.')">Xem cấu trúc</button></div></article>`}}
function showStation(v){const names=['','Khối 1 – Quê hương em','Khối 2 – Di sản quê hương','Khối 3 – Lễ hội truyền thống','Khối 4 – Danh thắng Đà Nẵng','Khối 5 – Khám phá địa phương'];toast(`Đã chọn xem thử: ${names[v]}`)}function previewImage(input,id){let file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Vui lòng chọn tệp ảnh.');const img=document.getElementById(id);img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);document.getElementById(id==='coverPreview'?'coverPath':'mapPath').textContent='Ảnh xem thử: '+file.name;toast('Đã xem trước ảnh trên thiết bị. Không tải tệp lên máy chủ.')}document.querySelector('#menuToggle').onclick=()=>{document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#mobileMask').classList.toggle('show')};document.querySelector('#mobileMask').onclick=()=>{document.querySelector('#sidebar').classList.remove('open');document.querySelector('#mobileMask').classList.remove('show')};renderNav();renderPage();
