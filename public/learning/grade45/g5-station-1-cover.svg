<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Dòng sông nối những câu chuyện quê hương</title><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="680" rx="30" fill="white"/><rect x="40" y="40" width="880" height="110" rx="20" fill="#047857"/><text x="70" y="86" font-size="28" fill="white">Dòng sông nối những câu chuyện quê hương</text><circle cx="90" cy="210" r="25" fill="#047857"/><text x="82" y="219" font-size="24" fill="white">1</text><text x="140" y="210" font-size="25" fill="#334155">Theo dòng Thu Bồn</text><text x="140" y="244" font-size="16" fill="#334155">Dùng bản đồ có nguồn để tìm vị trí, không dùng sơ đồ học tập như bản đồ địa</text><text x="140" y="269" font-size="16" fill="#334155">lí.</text><circle cx="90" cy="315" r="25" fill="#047857"/><text x="82" y="324" font-size="24" fill="white">2</text><text x="140" y="315" font-size="25" fill="#334155">Hòn Kẽm Đá Dừng bên sông</text><text x="140" y="349" font-size="16" fill="#334155">Vách núi đá bên sông tạo nên nét cảnh quan của Hòn Kẽm Đá Dừng.</text><circle cx="90" cy="420" r="25" fill="#047857"/><text x="82" y="429" font-size="24" fill="white">3</text><text x="140" y="420" font-size="25" fill="#334155">Dòng sông trong đời sống</text><text x="140" y="454" font-size="16" fill="#334155">Giá trị đời sống và văn hóa của sông cần được tìm hiểu cùng bối cảnh.</text><circle cx="90" cy="525" r="25" fill="#047857"/><text x="82" y="534" font-size="24" fill="white">4</text><text x="140" y="525" font-size="25" fill="#334155">Giữ nước, giữ cảnh quan</text><text x="140" y="559" font-size="16" fill="#334155">Bảo vệ sông bằng hành động phù hợp và tuân thủ an toàn.</text><text x="60" y="678" font-size="15" fill="#334155">Sơ đồ học tập; không phải ảnh tư liệu hoặc bản đồ địa lí.</text></g></svg>