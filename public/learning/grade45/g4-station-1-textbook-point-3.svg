<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Khí hậu và những dòng sông</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#047857"/><g font-family="Arial,sans-serif" fill="#047857"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Khí hậu và những dòng sông</text><text x="64" y="270" font-size="24" fill="#334155">Khí hậu có mùa mưa, mùa khô; sông ngòi gắn với đời sống</text><text x="64" y="306" font-size="24" fill="#334155">và sản xuất của người dân.</text><text x="64" y="342" font-size="24" fill="#334155"></text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>