<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Cùng chơi vui, cùng giữ luật</title><rect width="960" height="720" fill="#fff7ed"/><g font-family="Arial, sans-serif"><rect x="32" y="32" width="896" height="656" rx="35" fill="white"/><rect x="55" y="55" width="850" height="90" rx="24" fill="#7c3aed"/><text x="85" y="109" font-size="30" fill="white">Cùng chơi vui, cùng giữ luật</text><circle cx="110" cy="202" r="30" fill="#7c3aed"/><text x="100" y="214" font-size="32" fill="white">1</text><text x="160" y="198" font-size="27" fill="#334155">Những trò chơi quen thuộc</text><text x="160" y="233" font-size="18" fill="#334155">Trò chơi dân gian mang lại niềm vui và sự gắn bó.</text><circle cx="110" cy="307" r="30" fill="#7c3aed"/><text x="100" y="319" font-size="32" fill="white">2</text><text x="160" y="303" font-size="27" fill="#334155">Ai là người bắt dê?</text><text x="160" y="338" font-size="18" fill="#334155">Người bắt dê được bịt mắt; các bạn đóng vai dê tạo tiếng động.</text><circle cx="110" cy="412" r="30" fill="#7c3aed"/><text x="100" y="424" font-size="32" fill="white">3</text><text x="160" y="408" font-size="27" fill="#334155">Phạm vi và lượt chơi</text><text x="160" y="443" font-size="18" fill="#334155">Chơi trong phạm vi đã thống nhất và đổi vai theo luật.</text><circle cx="110" cy="517" r="30" fill="#7c3aed"/><text x="100" y="529" font-size="32" fill="white">4</text><text x="160" y="513" font-size="27" fill="#334155">Chơi cùng bạn và gia đình</text><text x="160" y="548" font-size="18" fill="#334155">Cùng giữ gìn trò chơi dân gian bằng cách chơi và chia sẻ.</text><text x="70" y="660" font-size="19" fill="#64748b">CHẠM ĐÀ NẴNG · Sơ đồ minh họa, không phải ảnh tư liệu</text></g></svg>