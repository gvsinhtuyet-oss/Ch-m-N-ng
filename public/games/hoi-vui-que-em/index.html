<style>
:root{font-family:ui-rounded,'Segoe UI',Arial,sans-serif;color:#153e35;background:#e6f0da;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 15% 0,#fff9d8 0,transparent 48%),linear-gradient(#dceee0,#eef2d9);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #e58d26;outline-offset:4px}button:disabled{cursor:default}header{max-width:1100px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:850;letter-spacing:1.5px;display:flex;align-items:center;gap:10px}.brand b{display:grid;place-items:center;border-radius:13px;width:36px;height:36px;background:#14634e;color:#fff;font-size:20px;letter-spacing:0}.sound{border:1px solid #b7cdb8;background:#ffffffab;color:#245344;padding:10px 14px;border-radius:99px;font-weight:750;min-height:44px}main{max-width:1060px;margin:auto;padding:0 22px 22px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.8px;text-transform:uppercase;color:#426b50}.title{text-align:center;margin:12px 0 18px}.title h1{font-size:clamp(30px,5vw,52px);letter-spacing:-1.8px;margin:7px 0;color:#145a46}.title p{margin:0;color:#57745b;font-size:15px;line-height:1.6}.scene{position:relative;overflow:hidden;border-radius:28px;background:#d6e5c4;box-shadow:0 16px 38px #335f3820;border:5px solid #ffffffb5}.scene svg{display:block;width:100%;height:auto}.scene-label{position:absolute;bottom:14px;left:18px;max-width:85%;border-radius:99px;background:#fff8e9ed;color:#486543;padding:8px 13px;font-size:12px;font-weight:750}.intro .scene{max-height:360px}.intro .scene svg{min-height:240px;object-fit:cover}.intro-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 4px}.intro-foot p{margin:0;font-size:14px;line-height:1.8;color:#496647}.primary{border:0;border-bottom:4px solid #084b3d;border-radius:17px;background:#14735b;color:white;font-weight:850;font-size:17px;padding:17px 28px;min-height:58px;box-shadow:0 6px 12px #15573d18}.primary:hover{background:#0d614c}.primary:active{transform:translateY(2px);border-bottom-width:2px}.primary:disabled{opacity:.45}.secondary{border:1px solid #bfd0b6;border-radius:15px;background:#fffaf0;color:#2e614a;font-weight:800;padding:14px 20px;min-height:52px}.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;gap:12px}.dots{display:flex;gap:7px}.dot{width:30px;height:9px;border-radius:10px;background:#becfb3}.dot.done{background:#137057}.dot.active{background:#e6a53b}.task-shell{background:#fffdf6;border-radius:28px;border:1px solid #e3e6d1;box-shadow:0 12px 35px #345c3412;padding:24px}.question-row{display:flex;gap:14px;justify-content:space-between;align-items:start}.question-row h2{font-size:clamp(22px,3vw,30px);line-height:1.35;letter-spacing:-.6px;margin:6px 0 8px}.instruction{color:#6b7960;margin:0 0 18px;font-size:14px}.listen{flex:none;border:1px solid #d6dfc9;border-radius:13px;background:#edf4e5;padding:12px;font-weight:800;color:#376745;min-height:48px}.mini-scene{height:180px;margin-bottom:18px}.mini-scene svg{height:100%;width:100%;object-fit:cover}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{position:relative;display:flex;align-items:center;gap:16px;text-align:left;min-height:115px;padding:16px;border:2px solid #e2e7d6;border-bottom-width:5px;border-radius:20px;background:#fff;color:#264e3d;font-size:18px;font-weight:800;line-height:1.4;transition:background .15s,border-color .15s}.choice:not(:disabled):hover{border-color:#87aa7a;background:#f5faed}.choice .art{display:grid;place-items:center;flex:none;width:84px;height:76px;border-radius:15px;background:#eef5e4;font-size:40px}.choice svg{width:100%;height:100%}.choice.correct{background:#e9f6df;border-color:#3e9664}.choice.wrong{background:#fff0df;border-color:#d89a56}.choice.selected{border-color:#39785b;background:#f0f7e8}.feedback{min-height:77px;margin-top:18px;border-radius:16px;padding:15px 17px;background:#f2f4e9;line-height:1.6;font-size:16px}.feedback.good{background:#e7f4de}.feedback.retry{background:#fff0dc}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:15px}.quiet{font-size:12px;color:#65775b}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}footer{text-align:center;font-size:11px;color:#6c7f5e;padding:6px 12px 18px;letter-spacing:.5px}.victory{text-align:center;position:relative;background:#fffdf3e8;border:1px solid #e4e7ce;border-radius:30px;padding:32px 20px}.medal{width:110px;height:110px;margin:0 auto 15px;display:grid;place-items:center;background:#ffe7a3;border-radius:35px;font-size:65px;box-shadow:0 0 0 10px #fff2cc}.victory h1{font-size:clamp(30px,5vw,46px);margin:10px 0;color:#145a46;letter-spacing:-1px}.victory p{line-height:1.8;color:#55704a}.ribbons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}.ribbons span{border:1px solid #ccddbc;border-radius:99px;padding:9px 14px;background:#edf5e3;font-size:13px;font-weight:750}.victory-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.fireworks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}.celebration-toggle{margin-top:20px;background:none;border:0;color:#486b4c;text-decoration:underline;min-height:44px}.voice-note{font-size:12px;color:#6a735d;min-height:18px;text-align:center;margin:0 0 8px}.character-names{display:flex;justify-content:center;gap:12px;margin-bottom:16px}.name-tag{background:#ecf3e3;border-radius:12px;padding:10px 18px;font-size:15px}.name-tag strong{color:#13634e} @media(max-width:600px){header{padding:12px 16px}.brand{font-size:10px;letter-spacing:.5px}.brand small{display:none}main{padding:0 12px 18px}.title{margin:8px 0 13px}.title h1{letter-spacing:-1px}.intro-foot{flex-direction:column;text-align:center;gap:14px}.intro-foot .primary{width:100%}.task-shell{padding:17px;border-radius:23px}.choices{gap:10px}.choice{flex-direction:column;text-align:center;gap:8px;padding:12px 8px;font-size:16px;min-height:155px}.choice .art{width:100%;max-width:120px;height:85px}.mini-scene{height:145px}.question-row h2{font-size:22px}.listen{font-size:12px;padding:11px 8px}.actions{align-items:stretch;flex-direction:column}.actions .primary{width:100%}.quiet{text-align:center}.scene-label{font-size:10px;bottom:10px;left:10px}.victory{padding:25px 14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="brand"><b>✦</b><span>CHẠM ĐÀ NẴNG<br><small style="font-weight:500;letter-spacing:.5px">Góc hội vui · Khối 1</small></span></div><button class="sound" id="sound" aria-pressed="true">♫ Âm thanh: bật</button></header>
<main id="app"></main><p id="voiceNote" class="voice-note" role="status"></p><footer>CHƠI CÙNG NHAU · HIỂU LUẬT · THÊM GẮN BÓ</footer><canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>
<script>
'use strict';
const app=document.getElementById('app');
const stationId='g1-station-2';
let sound=true,audio=null,musicTimer=null,musicStep=0,speaking=false,speechVersion=0,taskIndex=0,solved=false,selected=null,screen='intro',tries=0,firstTry=0,completionSent=false,celebrating=false,particles=[],animation=0,lastBurst=0,frameTime=0,choiceOrder=[];
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const tasks=[
{level:'Nhận biết',title:'Trò nào là Bịt mắt bắt dê?',instruction:'Nghe câu hỏi, rồi chạm vào một bức tranh.',options:[{id:'blindfold',label:'Bịt mắt bắt dê',art:'blindfold'},{id:'tug',label:'Kéo co',art:'tug'}],correct:'blindfold',hint:'Tìm trò có một bạn bịt mắt bằng khăn.',explain:'Đúng rồi! Một bạn bịt mắt tìm các bạn làm dê.'},
{level:'Hiểu',title:'Tiếng động giúp người bắt dê làm gì?',instruction:'Bạn bịt mắt không nhìn thấy. Em chọn một câu trả lời nhé!',options:[{id:'find',label:'Biết hướng để tìm dê',art:'listen'},{id:'end',label:'Biết đã hết lượt chơi',art:'flag'}],correct:'find',hint:'Các bạn làm dê tạo tiếng động khi di chuyển. Người bắt sẽ lắng nghe.',explain:'Tiếng động giúp người bắt biết hướng để tìm các bạn làm dê.'},
{level:'Hiểu',title:'Nam bắt được Mai. Ai bịt mắt ở lượt sau?',instruction:'Chạm chọn bạn sẽ làm người bắt dê tiếp theo.',options:[{id:'mai',label:'Mai bịt mắt',art:'mai'},{id:'nam',label:'Nam tiếp tục bịt mắt',art:'nam'}],correct:'mai',hint:'Bạn vừa bị bắt sẽ làm người bắt dê ở lượt tiếp theo.',explain:'Mai vừa bị bắt nên Mai bịt mắt ở lượt sau. Nam chuyển sang làm dê.'},
{level:'Vận dụng',title:'Em làm dê. Em có thể chạy tới đâu?',instruction:'Đường nét đứt là giới hạn sân chơi. Chọn chỗ vẫn ở trong sân.',options:[{id:'inside',label:'Chỗ A · trong sân',art:'inside'},{id:'outside',label:'Chỗ B · ngoài sân',art:'outside'}],correct:'inside',hint:'Dù người bắt đến gần, các bạn làm dê vẫn phải ở trong phạm vi chơi.',explain:'Em chọn chỗ A trong sân. Chạy ra ngoài giới hạn là chưa đúng luật.'}
];
function child(x,y,shirt,blind=false,girl=false,scale=1){return `<g transform="translate(${x} ${y}) scale(${scale})"><path d="M-12 41l-5 33m29-33 5 33" stroke="#584d46" stroke-width="11" stroke-linecap="round"/><path d="M-13 15l-22 20m48-20 22 20" stroke="#bf805c" stroke-width="9" stroke-linecap="round"/><rect x="-18" y="8" width="36" height="38" rx="11" fill="${shirt}"/><circle cy="-13" r="23" fill="#dba078"/><path d="M-23-16q-2-32 28-23 20 2 18 28l-13-17q-12 10-33 12" fill="#423a34"/>${girl?'<circle cx="-24" cy="-17" r="9" fill="#423a34"/><circle cx="24" cy="-17" r="9" fill="#423a34"/><path d="M-26-26l10 7-11 5m52-12-10 7 11 5" fill="#e5a43e"/>':''}${blind?'<path d="M-24-17h48v13h-48z" fill="#f9e7bd"/><path d="M24-11l16 12-18-2" fill="#e5ca8e"/>':'<circle cx="-8" cy="-12" r="2" fill="#423a34"/><circle cx="8" cy="-12" r="2" fill="#423a34"/>'}<path d="M-6-1q6 7 12 0" fill="none" stroke="#8c4f3e" stroke-width="2.5" stroke-linecap="round"/></g>`;}
function scene(blindOnMai=false){return `<svg viewBox="0 0 1000 360" role="img" aria-label="Tranh minh họa sân hội: các bạn chơi bịt mắt bắt dê trong sân làng"><rect width="1000" height="360" fill="#d4e9dc"/><circle cx="805" cy="64" r="37" fill="#fff2b4"/><path d="M0 170Q130 75 270 172T550 155T1000 163V360H0Z" fill="#9fbe8d"/><path d="M0 220Q280 170 510 220T1000 220V360H0Z" fill="#c3d4a1"/><path d="M270 135h170v105H270z" fill="#ead6a9"/><path d="M246 140l109-76 110 76z" fill="#b36748"/><rect x="334" y="173" width="42" height="67" rx="20" fill="#65836a"/><path d="M78 90v161m-20-110h40m804-57v176" stroke="#8c9570" stroke-width="12"/><g fill="#6a9b71"><circle cx="78" cy="72" r="57"/><circle cx="35" cy="108" r="39"/><circle cx="120" cy="110" r="43"/><circle cx="906" cy="73" r="63"/><circle cx="950" cy="116" r="42"/></g><path d="M150 45Q500 110 850 43" fill="none" stroke="#52745e" stroke-width="3"/>${[210,290,370,450,530,610,690,770].map((x,i)=>`<path d="M${x} ${i<4?56+i*6:80-(i-4)*6}l28 3-15 32z" fill="${['#d97a59','#edba54','#6b9c88'][i%3]}"/>`).join('')}<ellipse cx="570" cy="285" rx="245" ry="55" fill="#decda2"/><ellipse cx="570" cy="280" rx="224" ry="49" fill="none" stroke="#fff9df" stroke-width="4" stroke-dasharray="12 10"/>${child(540,222,'#efa74d',!blindOnMai,false,.83)}${child(700,214,'#6999b1',blindOnMai,true,.75)}${child(413,210,'#da8265',false,false,.7)}<path d="M739 185q12-10 15 0m-7-15q18-15 24 0" fill="none" stroke="#44735c" stroke-width="3" stroke-linecap="round"/><g fill="#ecb25d"><circle cx="170" cy="297" r="5"/><circle cx="827" cy="317" r="5"/><circle cx="240" cy="322" r="4"/></g></svg>`;}
function art(kind){const start='<svg viewBox="0 0 180 110" aria-hidden="true">',end='</svg>';if(kind==='blindfold')return start+child(68,41,'#e9a546',true,false,.65)+child(130,41,'#6e9aae',false,true,.65)+end;if(kind==='tug')return start+'<path d="M16 65h148" stroke="#a98b57" stroke-width="5"/>'+child(48,41,'#d78168',false,false,.65)+child(133,41,'#6e9aae',false,true,.65)+end;if(kind==='mai'||kind==='nam')return start+child(90,39,kind==='mai'?'#6e9aae':'#e9a546',true,kind==='mai',.73)+end;if(kind==='inside'||kind==='outside')return start+`<rect x="22" y="15" width="127" height="76" rx="15" fill="#cce1af"/><rect x="28" y="20" width="115" height="66" rx="12" fill="none" stroke="#54784a" stroke-width="3" stroke-dasharray="6 5"/><circle cx="${kind==='inside'?85:162}" cy="55" r="15" fill="#e9ac4e"/><text x="${kind==='inside'?85:162}" y="61" text-anchor="middle" fill="#3c583e" font-family="Arial" font-size="18" font-weight="bold">${kind==='inside'?'A':'B'}</text>`+end;if(kind==='listen')return '👂';return '🏁';}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initAudio(){if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio)audio=new Audio();}if(audio?.state==='suspended')audio.resume().catch(()=>{});}
function tone(freq,duration=.12,delay=0,volume=.08,type='sine'){if(!sound||!audio||document.hidden)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.03);}
function effect(type){initAudio();if(type==='correct')[523,659,784].forEach((n,i)=>tone(n,.18,i*.09,.09,'triangle'));else if(type==='wrong'){tone(330,.13,0,.05);tone(294,.18,.13,.05);}else if(type==='win')[523,659,784,1047].forEach((n,i)=>tone(n,.35,i*.16,.1,'triangle'));else tone(660,.07,0,.04);}
function startMusic(){if(musicTimer)return;musicTimer=window.setInterval(()=>{if(!sound||document.hidden)return;const notes=[262,330,392,330,294,349,392,349];tone(notes[musicStep++%notes.length],.45,0,speaking?.004:.018);},620);}
function stopSpeech(){speechVersion++;window.speechSynthesis?.cancel();speaking=false;}
function speak(text){stopSpeech();if(!sound||document.hidden)return;const synth=window.speechSynthesis;if(!synth){document.getElementById('voiceNote').textContent='Thiết bị chưa hỗ trợ đọc tiếng Việt. Em có thể xem chữ hoặc nhờ người lớn đọc cùng.';return;}const voices=synth.getVoices();const voice=voices.find(v=>/^vi(?:-|_)/i.test(v.lang)||v.lang==='vi');if(!voice){document.getElementById('voiceNote').textContent='Chưa có giọng đọc tiếng Việt trên thiết bị này. Em vẫn chơi được bằng hình và chữ.';return;}document.getElementById('voiceNote').textContent='';const version=speechVersion,u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang='vi-VN';u.rate=.86;u.pitch=1.05;u.onstart=()=>{if(version===speechVersion)speaking=true;};u.onend=()=>{if(version===speechVersion)speaking=false;};u.onerror=()=>{if(version===speechVersion){speaking=false;document.getElementById('voiceNote').textContent='Chưa đọc được lời hướng dẫn. Em có thể bấm Nghe lại.';}};synth.speak(u);}
function intro(){screen='intro';app.innerHTML=`<div class="title"><div class="eyebrow">Trò chơi dân gian · Chặng 2</div><h1>Hội vui quê em</h1><p>Một sân chơi nhỏ. Bốn điều em khám phá.</p></div><div class="intro"><div class="scene">${scene()}<span class="scene-label">Cùng chơi Bịt mắt bắt dê</span></div><div class="intro-foot"><p><strong>Nghe · chạm · cùng khám phá</strong><br>Không tính giờ. Chưa đúng thì mình thử lại nhé!</p><button class="primary" id="start">VÀO HỘI VUI →</button></div></div>`;document.getElementById('start').onclick=start;}
function start(){stopFireworks();stopSpeech();initAudio();startMusic();taskIndex=0;tries=0;firstTry=0;completionSent=false;choiceOrder=tasks.map(t=>shuffle(t.options));renderTask();}
function renderTask(){screen='task';solved=false;selected=null;const t=tasks[taskIndex];app.innerHTML=`<div class="meta"><div><span class="eyebrow">Hội vui quê em</span><div style="font-weight:850;margin-top:5px">Nhiệm vụ ${taskIndex+1} / 4</div></div><div class="dots" aria-label="Nhiệm vụ ${taskIndex+1} trên 4">${tasks.map((_,i)=>`<span class="dot ${i<taskIndex?'done':i===taskIndex?'active':''}"></span>`).join('')}</div></div><section class="task-shell"><div class="question-row"><div><div class="eyebrow">${t.level}</div><h2>${t.title}</h2></div><button class="listen" id="listen" aria-label="Nghe lại câu hỏi">◖)) Nghe lại</button></div><p class="instruction">${t.instruction}</p>${taskIndex!==0?`<div class="scene mini-scene">${scene()}<span class="scene-label">${taskIndex===2?'Nam áo vàng · Mai áo xanh':taskIndex===3?'Chơi trong phạm vi đã thống nhất':'Lắng nghe để tìm bạn'}</span></div>`:''}${taskIndex===2?'<div class="character-names"><span class="name-tag">🟡 <strong>Nam</strong> bắt được Mai</span><span class="name-tag">🔵 <strong>Mai</strong> vừa bị bắt</span></div>':''}<div class="choices">${choiceOrder[taskIndex].map(o=>`<button class="choice" data-choice="${o.id}" aria-label="${o.label}" aria-pressed="false"><span class="art">${art(o.art)}</span><span>${o.label}</span></button>`).join('')}</div><div id="feedback" class="feedback" role="status" aria-live="polite">Em cứ suy nghĩ nhé. Không cần vội!</div><div class="actions"><span class="quiet">${taskIndex===2?'Chọn bạn sẽ đổi vai ở lượt tiếp theo.':'Chạm một đáp án để kiểm tra.'}</span><button class="primary" id="next" disabled>${taskIndex===3?'HOÀN THÀNH ✦':'TIẾP THEO →'}</button></div></section>`;document.getElementById('listen').onclick=()=>{effect('click');speak(t.title+' '+t.instruction);};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));document.getElementById('next').onclick=next;speak(t.title+' '+t.instruction);}
function choose(id){if(screen!=='task'||solved)return;const t=tasks[taskIndex];if(!t.options.some(o=>o.id===id))return;selected=id;const correct=id===t.correct;const feedback=document.getElementById('feedback');document.querySelectorAll('[data-choice]').forEach(b=>{b.classList.remove('wrong','selected');b.setAttribute('aria-pressed',String(b.dataset.choice===id));});const button=document.querySelector(`[data-choice="${id}"]`);button.classList.add(correct?'correct':'wrong');if(correct){solved=true;if(taskIndex===2){document.querySelector('.mini-scene').innerHTML=scene(true)+'<span class="scene-label">Mai bịt mắt ở lượt tiếp theo · Nam làm dê</span>';}if(tries===0)firstTry++;effect('correct');feedback.className='feedback good';feedback.textContent='✓ '+t.explain;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);document.getElementById('next').disabled=false;speak(t.explain);}else{tries++;effect('wrong');feedback.className='feedback retry';feedback.textContent='Mình thử lại nhé! '+t.hint;speak('Mình thử lại nhé! '+t.hint);}}
function next(){if(screen!=='task'||!solved)return;effect('click');stopSpeech();tries=0;if(taskIndex===tasks.length-1)victory();else{taskIndex++;renderTask();}}
function notifyComplete(){if(completionSent)return;completionSent=true;if(window.parent!==window)window.parent.postMessage({type:'cham-danang-game-complete',stationId},window.location.origin);}
function victory(){screen='victory';effect('win');notifyComplete();app.innerHTML=`<section class="victory"><div class="eyebrow">Một ngày hội thật vui</div><div class="medal" aria-hidden="true">🎊</div><h1>Em đã hoàn thành!</h1><p><strong>4 / 4 nhiệm vụ</strong><br>Em đã hiểu cách chơi, biết đổi vai<br>và giữ đúng phạm vi sân chơi.</p><div class="ribbons"><span>✓ Nhận ra trò chơi</span><span>✓ Hiểu cách chơi</span><span>✓ Vận dụng luật</span></div><p style="font-size:14px">Lượt đầu đúng ${firstTry}/4 nhiệm vụ.<br>Mỗi lần thử lại là một lần em hiểu thêm!</p><div class="victory-actions"><button class="secondary" id="replay">↻ CHƠI LẠI</button><button class="primary" id="continue">TIẾP TỤC HÀNH TRÌNH →</button></div><button class="celebration-toggle" id="celebration">${reducedMotion?'Bật pháo hoa':'Tạm dừng pháo hoa'}</button><p id="continueNote" role="status" style="font-size:13px"></p></section>`;document.getElementById('replay').onclick=start;document.getElementById('continue').onclick=()=>{effect('click');if(window.parent!==window){window.parent.postMessage({type:'cham-danang-game-continue',stationId},window.location.origin);document.getElementById('continueNote').textContent='Nếu chưa chuyển trang, em chọn nút Tiếp tục hành trình bên dưới khung trò chơi.';}else document.getElementById('continueNote').textContent='Em đang chơi bản xem thử. Hãy mở trò chơi từ Chặng 2 trong app để đi tiếp.';};document.getElementById('celebration').onclick=()=>{celebrating?stopFireworks():startFireworks();document.getElementById('celebration').textContent=celebrating?'Tạm dừng pháo hoa':'Bật pháo hoa';};if(!reducedMotion)startFireworks();speak('Em đã hoàn thành bốn nhiệm vụ! Cùng giữ luật để cuộc chơi luôn vui nhé!');}
const canvas=document.getElementById('fireworks'),ctx=canvas.getContext('2d');function sizeCanvas(){canvas.width=Math.min(window.innerWidth,1600);canvas.height=Math.min(window.innerHeight,1200);}function burst(now){const side=Math.random()<.5;const x=canvas.width*(side ? .08+Math.random()*.2 : .72+Math.random()*.2),y=canvas.height*(.08+Math.random()*.28),colors=['#e9a737','#dd7858','#5a9c84','#649ab8'];for(let i=0;i<34;i++){const a=Math.PI*2*i/34,v=1.5+Math.random()*2.7;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color:colors[i%4]});}if(sound&&!speaking&&Math.random()<.35)tone(120+Math.random()*80,.16,0,.012,'triangle');lastBurst=now;}
function draw(now){if(!celebrating)return;if(document.hidden){animation=requestAnimationFrame(draw);return;}const dt=Math.min((now-(frameTime||now))/16.67,2);frameTime=now;ctx.clearRect(0,0,canvas.width,canvas.height);if(now-lastBurst>750)burst(now);particles=particles.filter(p=>p.life>0).slice(-240);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.025*dt;p.life-=.012*dt;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.8,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;animation=requestAnimationFrame(draw);}
function startFireworks(){if(celebrating||!ctx)return;sizeCanvas();celebrating=true;frameTime=0;lastBurst=0;animation=requestAnimationFrame(draw);}function stopFireworks(){celebrating=false;cancelAnimationFrame(animation);particles=[];ctx?.clearRect(0,0,canvas.width,canvas.height);}
document.getElementById('sound').onclick=()=>{sound=!sound;initAudio();const b=document.getElementById('sound');b.textContent=sound?'♫ Âm thanh: bật':'♫ Âm thanh: tắt';b.setAttribute('aria-pressed',String(sound));if(!sound)stopSpeech();else if(screen==='task')speak(tasks[taskIndex].title+' '+tasks[taskIndex].instruction);};window.addEventListener('resize',sizeCanvas);document.addEventListener('visibilitychange',()=>{if(document.hidden){stopSpeech();audio?.suspend().catch(()=>{});}else if(sound)audio?.resume().catch(()=>{});});window.addEventListener('pagehide',()=>{stopSpeech();stopFireworks();clearInterval(musicTimer);musicTimer=null;audio?.close().catch(()=>{});});intro();
</script>
</body></html>
