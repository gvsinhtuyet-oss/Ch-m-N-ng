name: CI

on:
  push:
    branches: [main, feature/gddp-teacher-2026-2027, deploy/cloudflare-preserve-api-20261028]
  pull_request:
    branches: [main, deploy/cloudflare-preserve-api-20261028]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript & Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Journey maps, two-option checkpoints and reward persistence
        run: node --import tsx --test journey-maps-test.ts

      - name: Mobile portrait layout contracts (cover, journey, four stages)
        run: node --test mobile-layout-regression-test.mjs

      - name: Stage 2 mobile toolbar, standalone HTML and all 25 route contracts
        run: node --import tsx --test stage2-mobile-hud-test.mjs

      - name: Server syntax check
        run: node --check auth-server.mjs && node --check content-server.mjs && node --check content-storage.mjs

      - name: Production packaging and database isolation tests
        run: node --test deployment-test.mjs production-api-test.mjs student-access-test.mjs

      - name: Student reconnect and pending-sync tests
        run: node --test student-sync-test.cjs

      - name: Authentication tests
        run: node --test auth-test.mjs
      - name: Verified feedback API, 25 ratings and Admin permission tests
        run: node --test learning-feedback-test.mjs

      - name: Firestore authentication storage tests
        run: node --test auth-storage-test.mjs

      - name: GDĐP catalog validation tests
        run: node --test gddp-catalog-test.mjs gddp-ai-test.mjs

      - name: Every integration address can reach a student Chặng 1 point
        run: node --import tsx --test gddp-teacher-routing-test.ts

      - name: Five-grade teacher lesson isolation tests
        run: npx tsx --test gddp-teacher-five-grades-test.ts

      - name: Grade 2 prepared lesson decks and exact bindings
        run: node --import tsx --test grade2-lesson-decks-test.ts

      - name: Content storage tests
        run: node --test content-storage-test.mjs

      - name: Da Nang assistant retrieval tests
        run: npm run test:assistant

      - name: Admin chatbot quality audit tests
        run: node --import tsx --test assistant-quality-admin-test.ts

      - name: Grade 1 integrated presentations and exact mappings
        run: node --import tsx --test grade1-lesson-decks-test.ts

      - name: Grade 4 and 5 content, media, narration and isolation
        run: node --import tsx --test grade45-content-test.ts grade4-review-test.ts grade5-review-test.ts audio-narration-test.ts narration-review-test.ts

      - name: Grade 3 topics, presentations and zero-network content tests
        run: node --import tsx --test grade3-content-test.ts

      - name: Grade 1 authored content and no-network regression
        run: node --import tsx --test grade1-content-test.ts stage-access-test.ts stage2-distinct-test.ts

      - name: Grade 1 folk game completion and replay
        run: node --test hoi-vui-game-test.mjs

      - name: Grade 2 current-book content and image tests
        run: npx tsx --test grade2-content-image-test.ts

      - name: Editable lesson plan and Word export tests
        run: node --import tsx --test lesson-plan-test.ts

      - name: Teacher Google access and private plans
        run: node teacher-workspace-test.mjs && node --test google-identity-test.mjs && node --import tsx --test teacher-plan-import-test.ts

      - name: Actual Teacher/Admin role routes and approved CSS regression
        run: node --test production-staff-ui-test.mjs

      - name: Admin charts and feedback visual regression
        run: node --test admin-report-visual-regression-test.mjs

      - name: Production build
        run: npm run build

      - name: Measure and smoke-test isolated production runtime
        run: node scripts/package-production.mjs && node --test production-package-test.mjs && node --test production-package-audit-test.mjs

  stage2-browser-qa:
    name: Stage 2 build and mobile Chromium QA (25 stations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Stage 2 station and reward tests
        run: node --import tsx --test stage2-mobile-hud-test.mjs stage2-shared-test.ts stage2-distinct-test.ts
      - name: Build Vite application
        run: npm run build
      - name: Browser test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core
      - name: Browser QA — iPhone/Android/iPad viewport emulation and interactions
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/cham-stage2-preview.log 2>&1 &
          for i in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --import tsx stage2-browser-qa.mjs
          node staff-admin-demo-qa.mjs
          node assistant-mobile-browser-qa.mjs
          node stage2-my-khe-intro-qa.mjs
      - name: LIVE public guest and Admin Demo UI (read-only, no writes)
        env:
          QA_URL: https://chamdanang-gddp.pages.dev/
          LIVE_READ_ONLY: 'true'
        run: |
          node assistant-mobile-browser-qa.mjs
          node staff-admin-demo-qa.mjs
      - name: Preserve screenshots (including failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-mobile-screenshots
          path: |
            stage2-qa-screenshots/
            staff-admin-qa/
          if-no-files-found: ignore

  live-student-identity-readonly:
    name: LIVE Student ID backend route (anonymous read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify teacher student-code route on Pages and existing AI Studio backend
        run: node scripts/student-identity-live-preflight.mjs

  live-admin-backend-readonly:
    name: LIVE Admin ratings/backend routing (diagnostic, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Production Admin and Firestore status without credentials
        env:
          PUBLIC_URL: https://chamdanang-gddp.pages.dev/
        run: node admin-live-backend-diagnostics.mjs

  live-learning-feedback-route-preflight:
    name: LIVE feedback server routing (anonymous GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check rating write route, proposal route, admin stats route without mutation
        run: node scripts/rating-backend-preflight.mjs
