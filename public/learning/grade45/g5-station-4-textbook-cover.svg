<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830"><title>Núi đá, ma nhai và bàn tay người thợ</title><rect width="960" height="830" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="790" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Núi đá, ma nhai và bàn tay người thợ</text><text x="65" y="195" font-size="20" fill="#047857">KHỐI 5 · HÀNH TRÌNH KHÁM PHÁ</text><text x="65" y="255" font-size="25" fill="#334155">1. Quần thể núi Ngũ Hành Sơn</text><text x="65" y="350" font-size="25" fill="#334155">2. Hang động, chùa cổ và bảo tàng</text><text x="65" y="445" font-size="25" fill="#334155">3. Ma nhai: chữ khắc lưu giữ ký ức</text><text x="65" y="540" font-size="25" fill="#334155">4. Làng đá Non Nước và lịch sử nghề</text><text x="65" y="635" font-size="25" fill="#334155">5. Sản phẩm đa dạng và bảo vệ núi đá</text><text x="65" y="730" font-size="25" fill="#334155">6. Giữ gìn cảnh quan và di sản</text><text x="55" y="790" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>