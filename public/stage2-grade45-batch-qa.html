<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm thử theo đợt 5 trạm</title><style>body{margin:0;background:#dce6ef;font:14px system-ui}nav{position:sticky;top:0;background:#fff;z-index:20;padding:8px;display:flex;gap:6px}button{padding:8px}main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px}section{background:white}h2{margin:6px;font-size:15px}iframe{border:0;display:block}</style><nav id="sizes"></nav><main id="frames"></main><script>const grade=Number(new URLSearchParams(location.search).get("grade"))||4;const rows=[{"id":"g4-station-1","grade":4,"n":1},{"id":"g4-station-3","grade":4,"n":2},{"id":"g4-station-2","grade":4,"n":3},{"id":"g4-thu-bon-hon-kem","grade":4,"n":4},{"id":"g4-station-4","grade":4,"n":5},{"id":"g5-ky-anh-me-nhu","grade":5,"n":1},{"id":"g5-station-3","grade":5,"n":2},{"id":"g5-station-4","grade":5,"n":3},{"id":"g5-lua-ma-chau","grade":5,"n":4},{"id":"g5-station-5","grade":5,"n":5}];for(const s of rows.filter(s=>s.grade===grade)){const section=document.createElement("section"),h=document.createElement("h2"),f=document.createElement("iframe");h.textContent="Khối "+grade+" · Trạm "+s.n;f.id="game-"+s.id;f.title=h.textContent;f.width=390;f.height=844;f.src="/?stage2-preview="+s.id;section.append(h,f);document.querySelector('#frames').append(section)}for(const [w,h]of [[390,844],[375,667],[320,640],[1366,768]]){const b=document.createElement("button");b.textContent=w+" × "+h;b.onclick=()=>{document.querySelectorAll("iframe").forEach(f=>{f.width=w;f.height=h})};sizes.append(b)}</script></html>
