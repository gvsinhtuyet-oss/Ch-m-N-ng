<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720"><title>Ma nhai – thông tin trên đá</title><rect width="960" height="720" rx="30" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="24" y="24" width="912" height="672" rx="26" fill="white"/><rect x="40" y="40" width="880" height="108" rx="20" fill="#047857"/><text x="66" y="88" font-size="27" fill="white">Ma nhai – thông tin trên đá</text><circle cx="480" cy="245" r="54" fill="#dcfce7"/><text x="464" y="260" font-size="42" fill="#047857">3</text><text x="75" y="365" font-size="28" fill="#334155">Di sản tư liệu văn khắc trên đá.</text><text x="75" y="581" font-size="21" fill="#334155">Quan sát tư liệu → Tìm căn cứ → Chia sẻ điều em hiểu</text><text x="55" y="674" font-size="17" fill="#475569">Sơ đồ học tập · Không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>