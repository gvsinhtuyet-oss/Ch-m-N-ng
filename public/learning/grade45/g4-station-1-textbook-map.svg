<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Thiên nhiên và con người Đà Nẵng</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#047857"/><g font-family="Arial,sans-serif" fill="#047857"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Thiên nhiên và con người Đà Nẵng</text><text x="64" y="255" font-size="24" fill="#334155">1. Đà Nẵng trên bản đồ</text><text x="64" y="297" font-size="24" fill="#334155">2. Núi, trung du và đồng bằng ven biển</text><text x="64" y="339" font-size="24" fill="#334155">3. Khí hậu và những dòng sông</text><text x="64" y="381" font-size="24" fill="#334155">4. Giữ gìn rừng, biển và sinh vật</text><text x="64" y="423" font-size="24" fill="#334155">5. Con người và những nét đẹp quê hương</text><text x="64" y="465" font-size="24" fill="#334155">6. Em giới thiệu và chăm sóc quê hương</text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>