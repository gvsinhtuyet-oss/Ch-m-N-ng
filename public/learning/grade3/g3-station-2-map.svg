<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Dấu chân người khai sáng</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#7c3aed"/><text x="75" y="92" font-size="28" fill="white">Dấu chân người khai sáng</text><circle cx="90" cy="200" r="24" fill="#7c3aed"/><text x="82" y="209" font-size="24" fill="white">1</text><text x="135" y="200" font-size="24" fill="#334155">Huỳnh Thúc Kháng – học và phụng sự</text><text x="135" y="232" font-size="17" fill="#334155">Huỳnh Thúc Kháng gắn với phong trào Duy Tân và báo Tiếng Dân.</text><circle cx="90" cy="305" r="24" fill="#7c3aed"/><text x="82" y="314" font-size="24" fill="white">2</text><text x="135" y="305" font-size="24" fill="#334155">Phan Châu Trinh – coi trọng việc học</text><text x="135" y="337" font-size="17" fill="#334155">Phan Châu Trinh coi trọng mở mang hiểu biết và canh tân đất nước.</text><circle cx="90" cy="410" r="24" fill="#7c3aed"/><text x="82" y="419" font-size="24" fill="white">3</text><text x="135" y="410" font-size="24" fill="#334155">Duy Tân – khát vọng tiến bộ</text><text x="135" y="442" font-size="17" fill="#334155">Duy Tân gắn với khát vọng đổi mới và mở mang việc học.</text><circle cx="90" cy="515" r="24" fill="#7c3aed"/><text x="82" y="524" font-size="24" fill="white">4</text><text x="135" y="515" font-size="24" fill="#334155">Tìm hiểu qua nơi lưu niệm</text><text x="135" y="547" font-size="16" fill="#334155">Cuộc đời và đóng góp của một người yêu nước.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>