<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650"><title>Tu bổ di tích và so sánh hai điểm đến</title><rect width="960" height="650" rx="24" fill="#f0fdf4"/><g font-family="Arial,sans-serif"><rect x="20" y="20" width="920" height="610" rx="24" fill="white"/><rect x="40" y="40" width="880" height="115" rx="18" fill="#047857"/><text x="65" y="85" font-size="27" fill="white">Tu bổ di tích và so sánh hai điểm đến</text><text x="75" y="235" font-size="48" fill="#047857">6</text><text x="75" y="325" font-size="28" fill="#334155">Bà Nà và Hải Vân Quan có những giá trị riêng; cần</text><text x="75" y="363" font-size="28" fill="#334155">bảo vệ cảnh quan và bảo tồn di tích khi phát triển</text><text x="75" y="401" font-size="28" fill="#334155">du lịch.</text><text x="75" y="535" font-size="24" fill="#334155">Quan sát → Tìm căn cứ → Chia sẻ</text><text x="55" y="610" font-size="18" fill="#334155">Sơ đồ học tập · không phải ảnh tư liệu hoặc bản đồ địa lí</text></g></svg>