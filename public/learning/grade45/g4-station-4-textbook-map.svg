<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Nghề đúc đồng ở Phước Kiều</title><rect width="960" height="720" rx="24" fill="#f8fafc"/><rect width="18" height="720" fill="#9a3412"/><g font-family="Arial,sans-serif" fill="#9a3412"><text x="64" y="65" font-size="21">CHẠM ĐÀ NẴNG · KHỐI 4</text><text x="64" y="126" font-size="32" font-weight="bold">Nghề đúc đồng ở Phước Kiều</text><text x="64" y="255" font-size="24" fill="#334155">1. Phước Kiều – làng nghề hơn 400 năm</text><text x="64" y="297" font-size="24" fill="#334155">2. Tạo mẫu và làm khuôn</text><text x="64" y="339" font-size="24" fill="#334155">3. Nấu, rót đồng và hoàn thiện</text><text x="64" y="381" font-size="24" fill="#334155">4. Sản phẩm truyền thống và sản phẩm mới</text><text x="64" y="423" font-size="24" fill="#334155">5. Giữ nghề và giới thiệu làng nghề</text><text x="64" y="675" font-size="17" fill="#64748b">Sơ đồ học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>