<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"><title>Duy Tân – khát vọng tiến bộ</title><g font-family="Arial,sans-serif"><rect x="25" y="25" width="910" height="670" rx="28" fill="white"/><rect x="45" y="45" width="870" height="110" rx="20" fill="#7c3aed"/><text x="75" y="92" font-size="28" fill="white">Duy Tân – khát vọng tiến bộ</text><path d="M220 330q130-70 260 0q130-70 260 0v240q-130-70-260 0q-130-70-260 0z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="10"/><path d="M480 330v240M260 385h160m-160 50h160m130-50h140m-140 50h140" stroke="#7c3aed" stroke-width="8"/><circle cx="480" cy="240" r="45" fill="#fde68a"/><text x="75" y="625" font-size="20" fill="#334155">Duy Tân gắn với khát vọng đổi mới và mở mang việc học.</text><text x="60" y="682" font-size="14" fill="#334155">Sơ đồ minh họa học tập; không phải ảnh tư liệu hay bản đồ địa lí.</text></g></svg>